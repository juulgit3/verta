async function generateGuestLink(name, email, expiresInDays){
  if(!name || !email){ showToast('Udfyld både navn og mail.','error'); return; }
  const eventIdAtStart = state.eventId;
  state.guestLinkBusy=true; render();
  try{
    const {data, error}=await mutate(()=>sb.functions.invoke('invite-guest', {body:{eventId:eventIdAtStart, email, displayName:name, expiresInDays:expiresInDays||null}}));
    if(error || !data || !data.link){
      showToast('Kunne ikke oprette link: '+(error?.message || data?.error || 'ukendt fejl'),'error');
      return;
    }
    /* Stemples med det arrangement, linket faktisk blev genereret til — ikke det, der måtte være åbent, når svaret kommer tilbage. */
    state.guestLink=data.link;
    state.guestLinkEventId=eventIdAtStart;
    pushLog({area:'system', label:'Gæstelink', cust:false, friendly:'Magisk link genereret til '+name+' ('+email+')'});
    await loadEventGuestAccesses(eventIdAtStart);
  }catch(e){
    showToast('Kunne ikke oprette link: '+e.message,'error');
  }finally{
    state.guestLinkBusy=false; render();
  }
}
async function loadEventGuestAccesses(eventId){

function copyGuestLink(){

  navigator.clipboard.writeText(state.guestLink).then(()=>{
    const btn=document.getElementById('guestLinkCopy');
    if(btn){ const old=btn.textContent; btn.textContent='Kopieret!'; setTimeout(()=>btn.textContent=old,1500); }

async function createEvent(){
  const title=document.getElementById('neTitle').value.trim();
  const venueId=document.getElementById('neVenue').value;
  const date=document.getElementById('neDate').value;
  const eventType=document.getElementById('neType').value;
  const ownerId=document.getElementById('neOwner').value;
  const useTasks=document.getElementById('neTasks').checked;
  const templateEl=document.getElementById('neTemplate');
  const templateId=templateEl?templateEl.value:'';
  if(!title||!venueId||!date||!ownerId){ showToast('Udfyld titel, lokation, dato og koordinator.','error'); return; }
  const btn=document.getElementById('neCreate'), orig=btn.textContent;
  btn.disabled=true; btn.textContent='Opretter…';
  const {error}=await mutate(()=>sb.from('events')
    .insert({title, venue_id:venueId, org_id:state.orgId, event_date:date, offer_total_kr:0, status:'kladde', event_type:eventType, owner_staff_id:ownerId}));
  if(error){ btn.disabled=false; btn.textContent=orig; showToast('Kunne ikke oprette: '+error.message,'error'); return; }
  /* Knappen forbliver deaktiveret/"Opretter…", indtil vi enten navigerer ind i det nye arrangement eller
     falder tilbage til oversigten — ellers ser formularen momentant ud til at være klar til et nyt (dobbelt-)tryk. */
  const {data:evs}=await sb.from('events').select('id,title,event_date,status,offer_total_kr,event_type,owner_staff_id,venues(name)').eq('org_id',state.orgId).order('event_date',{ascending:false});
  state.events=evs||[];
  const created=(state.events||[]).find(e=>e.title===title && e.event_date===date);
  if(created){
    if(templateId) await applyTemplateToEvent(templateId, created.id, date);
    else if(useTasks) await applyTaskTemplates(created.id, date, eventType);
    state.newEventFromTemplate=null;
    state.modal=null;
    await openEvent(created.id);
  } else { btn.disabled=false; btn.textContent=orig; render(); }
}

async function loadOrgTemplates(){
  const {data,error}=await sb.from('event_templates').select('*').eq('org_id',state.orgId).order('created_at');
  if(error){ console.error('templates',error); state.orgTemplates=[]; return; }
  state.orgTemplates=data||[];
}
function minutesToTime(mins){ const m=((mins%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
async function applyTemplateToEvent(templateId, eventId, eventDate){
  const tmpl=(state.orgTemplates||[]).find(t=>t.id===templateId);
  if(!tmpl) return;
  const spec=tmpl.spec||{};
  if(spec.phases && spec.phases.length){
    const rows=spec.phases.map((p,i)=>({event_id:eventId, label:p.label||('Fase '+(i+1)), room_id:null,
      start_time: p.startOffsetMin!=null? minutesToTime(p.startOffsetMin): null,
      end_time: p.endOffsetMin!=null? minutesToTime(p.endOffsetMin): null, sort_order:i}));
    const {error}=await mutate(()=>sb.from('event_rooms').insert(rows));
    if(error) showToast('Kunne ikke oprette faser fra skabelonen: '+error.message,'error');
  }
  if(spec.catalogItemIds && spec.catalogItemIds.length){
    const {error}=await mutate(()=>sb.from('event_catalog_items').insert(spec.catalogItemIds.map(id=>({event_id:eventId, catalog_item_id:id}))));
    if(error) showToast('Kunne ikke tilføje katalogvarer fra skabelonen: '+error.message,'error');
  }
  if(spec.taskTemplates && spec.taskTemplates.length){
    const rows=spec.taskTemplates.map((t,i)=>({event_id:eventId, title:t.title, owner:t.owner||'jer',
      due_date: t.daysBeforeEvent!=null? addDays(eventDate,-t.daysBeforeEvent): null, note:t.note||'', sort_order:i}));
    const {error}=await mutate(()=>sb.from('agenda_items').insert(rows));
    if(error) showToast('Kunne ikke tilføje opgaver fra skabelonen: '+error.message,'error');
  }
  if(spec.approvalTypes && spec.approvalTypes.length){
    const rows=spec.approvalTypes.map(t=>({event_id:eventId, title:'Ny '+(APPROVAL_TYPES[t]||t).toLowerCase(), approval_type:t, status:'kladde'}));
    const {error}=await mutate(()=>sb.from('event_approvals').insert(rows));
    if(error) showToast('Kunne ikke oprette godkendelseskladder fra skabelonen: '+error.message,'error');
  }
  pushLog({area:'system', label:'Skabelon anvendt', cust:false, friendly:'Arrangementet blev sat op fra skabelonen "'+tmpl.name+'"'});
}

  const active=(state.orgTemplates||[]).filter(t=>!t.archived);

/* Inline-handlinger direkte på "Kræver handling"-kortet — koordinatoren skal kunne handle uden at
   forlade forsiden. Kun de årsager, der reelt kan afgøres med ét felt/klik uden yderligere kontekst
   (opgave udført, tilknyt koordinator, opret gæstelink) får en inline-kontrol; resten (besked, afvist
   godkendelse, ændringsforslag, manglende lokale, prisafvigelse) beholder kun "Åbn arrangement", da et
   ægte svar dér kræver at se selve sammenhængen. Disse funktioner må ALDRIG antage, at det ramte
   arrangement er state.eventId — kortene viser arrangementer på tværs af hele indbakken, ikke kun det
   evt. åbne. */
/* Hvilke "Kræver handling"-årsager der kan afgøres direkte i inboxAction-modalen, uden at åbne
   selve arrangementet. Bruges både til at afgøre om et kort skal vise en "Handle"-knap, og til at
   afgøre om modalen kan lukkes automatisk, når intet er tilbage at handle på. */
function inboxActionableKinds(reasons){
  return (reasons||[]).filter(r=>(r.kind==='task' && r.tasks && r.tasks.length) || r.kind==='ejer' || r.kind==='gaestelink');
}
function closeInboxModalIfResolved(eventId){
  const stillActionable = inboxActionableKinds(state.eventExceptions[eventId]||[]).length>0;
  if(!stillActionable && state.modal && state.modal.type==='inboxAction' && state.modal.eventId===eventId) closeModal();
  else render();
}
async function inboxCompleteTask(eventId, taskId, taskTitle, fromStatus){
  const {error}=await mutate(()=>sb.from('agenda_items').update({status:'aftalt'}).eq('id',taskId));
  if(error){ showToast('Kunne ikke markere som udført: '+error.message,'error'); return; }
  await mutate(()=>sb.from('activity_log').insert({event_id:eventId, ts:new Date().toISOString(),
    actor_name:currentActor().navn, actor_side:currentActor().side, entry_type:'change', area:'punkter',
    label:taskTitle, from_val:fromStatus||'', to_val:'aftalt', customer_visible:true,
    friendly:taskTitle+' er nu udført', message_text:''}));
  showToast('Opgave markeret som udført ✓','ok');
  await loadPickerExceptions();
  closeInboxModalIfResolved(eventId);
}
async function inboxAssignOwner(eventId, staffId){
  const {error}=await mutate(()=>sb.from('events').update({owner_staff_id:staffId}).eq('id',eventId));
  if(error){ showToast('Kunne ikke tilknytte koordinator: '+error.message,'error'); return; }
  const ev=(state.events||[]).find(x=>x.id===eventId); if(ev) ev.owner_staff_id=staffId;
  const staffName=((state.roster||[]).find(r=>r.id===staffId)||{}).name||'—';
  await mutate(()=>sb.from('activity_log').insert({event_id:eventId, ts:new Date().toISOString(),
    actor_name:currentActor().navn, actor_side:currentActor().side, entry_type:'change', area:'system',
    label:'Primær koordinator', from_val:'', to_val:staffName, customer_visible:false,
    friendly:staffName+' tilknyttet som koordinator', message_text:''}));
  showToast('Koordinator tilknyttet ✓','ok');
  await loadPickerExceptions();
  closeInboxModalIfResolved(eventId);
}
async function inboxCreateGuestLink(eventId, name, email){
  if(!name || !email){ showToast('Udfyld både navn og mail.','error'); return; }
  const {data, error}=await mutate(()=>sb.functions.invoke('invite-guest', {body:{eventId, email, displayName:name, expiresInDays:null}}));
  if(error || !data || !data.link){ showToast('Kunne ikke oprette link: '+(error?.message || data?.error || 'ukendt fejl'),'error'); return; }
  try{ await navigator.clipboard.writeText(data.link); showToast('Gæstelink oprettet og kopieret ✓','ok'); }
  catch(e){ showToast('Gæstelink oprettet: '+data.link,'ok'); }
  await mutate(()=>sb.from('activity_log').insert({event_id:eventId, ts:new Date().toISOString(),
    actor_name:currentActor().navn, actor_side:currentActor().side, entry_type:'change', area:'system',
    label:'Gæstelink', from_val:'', to_val:'', customer_visible:false,
    friendly:'Gæstelink genereret til '+name+' ('+email+')', message_text:''}));
  await loadPickerExceptions();
  closeInboxModalIfResolved(eventId);
}
function inboxActionFormsHtml(e, actionable){
  const blocks=[];
  const taskReason=actionable.find(r=>r.kind==='task');
  if(taskReason){
    blocks.push(`<div style="margin-bottom:16px">
      <div class="note" style="font-weight:600;margin-bottom:6px">Udestående opgaver</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${taskReason.tasks.map(t=>`<div class="row" style="justify-content:space-between;gap:10px">
          <span style="font-size:13.5px">${esc(t.title)}</span>
          <button class="btn" style="padding:4px 10px;font-size:12px;flex-shrink:0" data-inbox-task-done="${t.id}" data-inbox-task-event="${e.id}" data-inbox-task-title="${esc(t.title)}" data-inbox-task-from="${esc(t.status)}">✓ Udført</button>
        </div>`).join('')}
      </div>
    </div>`);
  }
  if(actionable.some(r=>r.kind==='ejer')){
    blocks.push(`<div style="margin-bottom:16px">
      <div class="note" style="font-weight:600;margin-bottom:6px">Tilknyt koordinator</div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <select class="status" data-inbox-owner-select="${e.id}" style="min-width:170px">
          <option value="">Vælg koordinator…</option>
          ${(state.roster||[]).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}
        </select>
        <button class="btn" data-inbox-owner-assign="${e.id}">Tilknyt</button>
      </div>
    </div>`);
  }
  if(actionable.some(r=>r.kind==='gaestelink')){
    blocks.push(`<div>
      <div class="note" style="font-weight:600;margin-bottom:6px">Opret gæstelink</div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <input class="search" placeholder="Gæstens navn" data-inbox-guest-name="${e.id}" style="max-width:170px">
        <input class="search" placeholder="Gæstens mail" type="email" data-inbox-guest-email="${e.id}" style="max-width:200px">
        <button class="btn" data-inbox-guest-create="${e.id}">Opret gæstelink</button>
      </div>
    </div>`);
  }
  return blocks.join('');

/* "Handle"-knappen på et Kræver handling-kort åbner denne modal i stedet for at folde formularerne
   ud direkte i kortet — se CLAUDE.md/samtalen: en fuld formular pr. kort pr. arrangement fyldte for
   meget og gik ud over overblikket. Modalen lukker sig selv, når sidste actionable årsag er løst
   (closeInboxModalIfResolved), så flowet stadig føles étkliks for det enkle tilfælde. */
MODAL_RENDERERS.inboxAction = function(){
  const eventId=state.modal.eventId;
  const e=(state.events||[]).find(x=>x.id===eventId);
  if(!e) return `<div class="empty">Arrangementet blev ikke fundet.</div>`;
  const reasons=state.eventExceptions[eventId]||[];
  const actionable=inboxActionableKinds(reasons);
  return `
  <h2 style="font-family:'Instrument Serif',serif;font-style:italic;font-size:24px;font-weight:400;margin:0 0 4px">${esc(e.title)}</h2>
  <p class="note" style="margin:0 0 14px">${datoKort(e.event_date)}${e.venues?' · '+esc(e.venues.name):''}</p>
  ${actionable.length?inboxActionFormsHtml(e, actionable):'<div class="empty">Intet tilbage at handle på her.</div>'}
  <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">
    <button class="btn" data-inbox-open-event="${e.id}" data-inbox-open-tab="${esc((reasons[0]||{}).actionTab||'oversigt')}">Åbn arrangement →</button>
    <button class="btn primary" data-modal-close>Luk</button>
  </div>`;
};
MODAL_BINDERS.inboxAction = function(){
  const eventId=state.modal.eventId;
  document.querySelectorAll('[data-inbox-task-done]').forEach(el=>el.onclick=()=>inboxCompleteTask(el.dataset.inboxTaskEvent, el.dataset.inboxTaskDone, el.dataset.inboxTaskTitle, el.dataset.inboxTaskFrom));
  const ownerBtn=document.querySelector('[data-inbox-owner-assign]');
  if(ownerBtn) ownerBtn.onclick=()=>{
    const sel=document.querySelector(`[data-inbox-owner-select="${eventId}"]`);
    if(!sel || !sel.value){ showToast('Vælg en koordinator først.','error'); return; }
    inboxAssignOwner(eventId, sel.value);
  };
  const guestBtn=document.querySelector('[data-inbox-guest-create]');
  if(guestBtn) guestBtn.onclick=()=>{
    const nameEl=document.querySelector(`[data-inbox-guest-name="${eventId}"]`);
    const emailEl=document.querySelector(`[data-inbox-guest-email="${eventId}"]`);
    inboxCreateGuestLink(eventId, nameEl?nameEl.value.trim():'', emailEl?emailEl.value.trim():'');
  };
  const openBtn=document.querySelector('[data-inbox-open-event]');
  if(openBtn) openBtn.onclick=()=>{
    const evId=openBtn.dataset.inboxOpenEvent;
    state.pendingInboxTab=openBtn.dataset.inboxOpenTab;
    closeModal();
    openEvent(evId);
  };
};
function actionRequiredSection(){
  if(state.pickerExceptionsLoading){
    return `<section class="card" style="border-left:3px solid var(--amber)">
      <header><h2>Kræver handling</h2></header>
      <div class="empty">Henter…</div>
    </section>`;
  }
  if(state.pickerExceptionsError){
    return `<section class="card" style="border-left:3px solid var(--amber)">
      <header><h2>Kræver handling</h2></header>
      <div class="empty">Kunne ikke hente. <button class="btn" id="exceptionsRetry">Prøv igen</button></div>
    </section>`;
  }
  const ids=Object.keys(state.eventExceptions||{});
  if(!ids.length) return '';
  let events=(state.events||[]).filter(e=>state.eventExceptions[e.id]&&state.eventExceptions[e.id].length);
  if(!events.length) return '';
  const f=state.inboxFilter||{who:'alle',kind:'alle'};
  const today=new Date().toISOString().slice(0,10), in7=addDays(today,7);
  const reasonsMatchFilter = reasons => {
    let rs=reasons;
    if(f.who && f.who!=='alle'){
      if(f.who==='mine') rs=rs; // "mine" filtres på event-niveau (owner_staff_id), se nedenfor
      else rs=rs.filter(r=>r.who===f.who);
    }
    if(f.kind && f.kind!=='alle'){
      const kindMap={overskredet:r=>r.tier===1, kommende:r=>r.tier===4, godkendelser:r=>r.kind==='godkendelse', pris:r=>r.kind==='pris', lokaler:r=>r.kind==='lokale', beskeder:r=>r.kind==='besked'};
      rs=rs.filter(kindMap[f.kind]||(()=>true));
    }
    return rs;
  };
  events = events.filter(e=>{
    if(f.who==='mine' && e.owner_staff_id!==state.userId) return false;
    const rs=reasonsMatchFilter(state.eventExceptions[e.id]);
    return rs.length>0;
  });
  if(!events.length){
    return `<section class="card" style="border-left:3px solid var(--amber)">
      <header><h2>Kræver handling</h2></header>
      ${inboxFilterBar()}
      <div class="empty">Intet matcher de valgte filtre.</div>
    </section>`;
  }
  const minTier = e => Math.min(...reasonsMatchFilter(state.eventExceptions[e.id]).map(r=>r.tier||5));
  const sorted=[...events].sort((a,b)=>{
    if(state.inboxSort==='dato') return (a.event_date||'').localeCompare(b.event_date||'');
    const at=minTier(a), bt=minTier(b);
    if(at!==bt) return at-bt;
    return (a.event_date||'').localeCompare(b.event_date||'');
  });
  return `<section class="card" style="border-left:3px solid var(--amber)">
    <header><h2>Kræver handling</h2><span class="note">${sorted.length} arrangement${sorted.length>1?'er':''}</span></header>
    ${inboxFilterBar()}
    ${sorted.map(e=>{
      const reasons=reasonsMatchFilter(state.eventExceptions[e.id]).sort((a,b)=>(a.tier||5)-(b.tier||5));
      const d=dageTil(e.event_date);
      const top=reasons[0];
      const canHandle=inboxActionableKinds(reasons).length>0;
      return `<div class="item" style="flex-wrap:wrap">
        <span class="stripe ${top.tier<=1?'kilden':(top.tier<=2?'warn':'jer')}"></span>
        <div style="flex:1;min-width:200px">
          <div class="name">${esc(e.title)}</div>
          <div class="meta">${datoKort(e.event_date)} · ${d>=0?('om '+d+' dage'):(Math.abs(d)+' dage siden')}${e.venues?' · '+esc(e.venues.name):''}${e.event_type?' · '+esc(e.event_type):''}</div>
          <div style="margin-top:6px">${reasons.map(r=>`<span class="chip ${r.urgent?'warn':''}" style="margin:0 6px 4px 0" title="${esc(INBOX_TIER_LABEL[r.tier]||'')}"><span class="dot"></span>${esc(r.txt)}</span>`).join('')}</div>
        </div>
        <div class="row" style="gap:8px;flex-shrink:0">
          ${canHandle?`<button class="btn primary" data-inbox-handle="${e.id}">Handle</button>`:''}
          <button class="btn ${canHandle?'':'primary'}" data-open="${e.id}" data-goto-inbox-tab="${esc(top.actionTab||'oversigt')}">${canHandle?'Åbn arrangement':esc(top.actionLabel||'Åbn')} →</button>
        </div>
      </div>`;
    }).join('')}
  </section>`;
}

  const f=state.inboxFilter||{who:'alle',kind:'alle'};
  return `<div class="row noprint" style="gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <select id="inboxWho" class="search" style="max-width:170px">
      <option value="alle" ${f.who==='alle'?'selected':''}>Hele teamet</option>
      <option value="mine" ${f.who==='mine'?'selected':''}>Mine</option>
      <option value="kunde" ${f.who==='kunde'?'selected':''}>Afventer kunde</option>

    </select>
    <select id="inboxKind" class="search" style="max-width:170px">
      <option value="alle" ${f.kind==='alle'?'selected':''}>Alle typer</option>
      <option value="overskredet" ${f.kind==='overskredet'?'selected':''}>Overskredet</option>
      <option value="kommende" ${f.kind==='kommende'?'selected':''}>Kommende 7 dage</option>
      <option value="godkendelser" ${f.kind==='godkendelser'?'selected':''}>Godkendelser</option>

/* Fælles for admin- og koordinatorforsiden: søg/sortér/filtrér + status-grupperet liste. `state.events`
   er allerede korrekt afgrænset af RLS (event_read via is_org_staff) — en koordinator får kun de
   arrangementer, de reelt er tilknyttet (owner/sekundær/event_staff), en admin ser alle i org'en.
   Denne funktion skal derfor IKKE selv filtrere på ejerskab; kun de to forsider omkring den varierer. */
function pickerEventListHtml(){
  const q=state.pickerSearch.trim().toLowerCase();
  let filtered=(state.events||[]).filter(e=>{
    if(state.pickerFilterStatus!=='alle' && e.status!==state.pickerFilterStatus) return false;
    if(!q) return true;
    return e.title.toLowerCase().includes(q) || ((e.venues&&e.venues.name)||'').toLowerCase().includes(q) || (e.event_type||'').toLowerCase().includes(q);
  });
  const sortFns = {
    dato: (a,b)=>(a.event_date||'').localeCompare(b.event_date||''),
    titel: (a,b)=>a.title.localeCompare(b.title,'da'),
    frist: (a,b)=>(state.eventNextDue[a.id]||'9999-99-99').localeCompare(state.eventNextDue[b.id]||'9999-99-99')
  };
  filtered=[...filtered].sort(sortFns[state.pickerSort]||sortFns.dato);
  const grp={}; EVENT_STATUSES.forEach(([v])=>grp[v]=[]);
  filtered.forEach(e=>{ (grp[e.status]||(grp[e.status]=[])).push(e); });
  const sec=(key,titel,liste)=>liste.length?`<details class="card" data-picker-group="${key}" ${state.openPickerGroups.has(key)?'open':''}>
    <summary><h2><span class="fold-chev">▸</span>${titel}</h2><span class="note">(${liste.length})</span></summary>
    ${liste.map(e=>{
      const reasons=state.eventExceptions[e.id]||[];
      const koord=(state.roster||[]).find(r=>r.id===e.owner_staff_id);
      return `<div class="item" data-open="${e.id}" style="cursor:pointer">
      <span class="stripe ${e.status!=='afviklet'?'jer':''}"></span>
      <div><div class="name">${esc(e.title)}</div><div class="meta">${e.event_type?e.event_type+' · ':''}${e.venues?esc(e.venues.name):'ingen lokation'} · ${datoKort(e.event_date)} · ${koord?esc(koord.name):'ingen koordinator'}</div>${reasons.length?`<div class="meta" style="color:var(--amber);margin-top:2px">${esc(reasons[0].txt)}</div>`:''}</div>
      <span class="row" style="gap:6px">${eventStatusChip(e.status)}<span class="chip"><span class="dot"></span>${e.offer_total_kr?kr(e.offer_total_kr):'Intet tilbud'}</span></span></div>`;
    }).join('')}</details>`:'';
  const filterBar = (state.events||[]).length ? `
  <div class="row noprint" style="margin:14px 0 2px;gap:8px;flex-wrap:wrap">
    <input class="search" id="pickerSearch" placeholder="Søg arrangement, type eller lokation" value="${esc(state.pickerSearch)}" style="flex:2;min-width:200px">
    <select id="pickerSort" class="search" style="max-width:170px">
      <option value="dato" ${state.pickerSort==='dato'?'selected':''}>Sortér: dato</option>
      <option value="titel" ${state.pickerSort==='titel'?'selected':''}>Sortér: titel</option>
      <option value="frist" ${state.pickerSort==='frist'?'selected':''}>Sortér: næste frist</option>
    </select>
    <select id="pickerFilterStatus" class="search" style="max-width:170px">
      <option value="alle" ${state.pickerFilterStatus==='alle'?'selected':''}>Alle statusser</option>
      ${EVENT_STATUSES.map(([v,l])=>`<option value="${v}" ${state.pickerFilterStatus===v?'selected':''}>${l}</option>`).join('')}
    </select>
  </div>` : '';
  return `${filterBar}
    ${EVENT_STATUSES.map(([v,l])=>sec(v,l,grp[v])).join('')}
    ${state.events.length?'':'<div class="empty">Ingen arrangementer endnu.</div>'}
    ${(state.events.length && !filtered.length)?'<div class="empty">Ingen arrangementer matcher søgning/filter.</div>':''}`;
}
function pickerHeaderHtml(){
  return `
    <div class="row" style="justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin:20px 0 16px">
      <div>
        <div class="eyebrow">${esc(nowDate().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'}))}</div>
        <h1 style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:28px;margin:2px 0 0">${greeting()}, ${esc(currentActor().navn)}</h1>
      </div>
      <div class="row noprint" style="gap:8px">
        <button class="btn" id="openKalenderBtn">Lokalekalender</button>
        ${(state.venues||[]).length?'<button class="btn primary" id="newEventBtn">+ Nyt arrangement</button>':''}
      </div>
    </div>`;
}
function viewPicker(){
  return (state.isAdmin && !state.viewAsCoordinator) ? viewAdminHome() : viewCoordinatorHome();
}
/* Admins forside: styringsværktøjer (consoleNav) fremhævet, KPI-tiles for HELE organisationen, og
   "Kræver handling" uden indskrænkning — det hurtige, overordnede overblik admin bad om, klart
   adskilt fra koordinatorens personlige arbejdsliste nedenfor. */
function viewAdminHome(){
  const evs=state.events||[];
  const today=todayIso(), in7=addDays(today,7);
  const kpi = {
    total: evs.length,
    kraeverHandling: Object.values(state.eventExceptions||{}).filter(rs=>rs&&rs.length).length,
    kommende7: evs.filter(e=>e.event_date>=today && e.event_date<=in7).length,
    bekraeftet: evs.filter(e=>e.status==='bekræftet').length
  };
  const kpiCard=(label,val)=>`<div class="card" style="text-align:center;padding:16px 10px"><div class="num" style="font-size:26px;font-weight:700">${val}</div><div class="note" style="margin-top:2px">${label}</div></div>`;
  const setup = {
    venues:(state.venues||[]).length, events:evs.length,
    catalog:(state.orgCatalog&&state.orgCatalog.length)||state.orgCatalogCount||0,
    staff:(state.staffList&&state.staffList.length)||state.orgStaffCount||0
  };
  const showSetup = !state.orgOnboardingDismissed && !(setup.venues>0 && setup.events>0);
  const setupKort = showSetup ? checklistHtml('Kom godt i gang', `${[setup.venues>0,setup.catalog>0,setup.staff>1,setup.events>0].filter(Boolean).length}/4`, [
    {done:setup.venues>0, label:'Opret jeres første lokation (+ mindst ét lokale)', action:setup.venues>0?'':'<button class="btn" data-nav="venues">Gå til →</button>'},
    {done:setup.catalog>0, label:'Byg jeres priskatalog', optional:true, action:setup.catalog>0?'':'<button class="btn" data-nav="katalog">Gå til →</button>'},
    {done:setup.staff>1, label:'Inviter kolleger', optional:true, action:setup.staff>1?'':'<button class="btn" data-nav="users">Gå til →</button>'},
    {done:setup.events>0, label:'Opret jeres første arrangement'}
  ], '<div class="row" style="margin-top:12px"><button class="btn" id="setupDismiss">Skjul denne guide</button></div>') : '';
  return `${consoleNav('picker')}
    ${pickerHeaderHtml()}
    ${setupKort}
    <div class="kpigrid">
      ${kpiCard('Arrangementer i alt',kpi.total)}
      ${kpiCard('Kræver handling',kpi.kraeverHandling)}
      ${kpiCard('Kommende 7 dage',kpi.kommende7)}
      ${kpiCard('Bekræftet',kpi.bekraeftet)}
    </div>
    ${actionRequiredSection()}
    <div style="margin:24px 0 10px"><span class="eyebrow">Admin · alle arrangementer</span></div>
    ${pickerEventListHtml()}`;
}
/* Koordinatorens forside: ingen styringsværktøjer, ingen org-KPI'er — kun det, der er personligt
   relevant. "Kræver handling" og listen nedenfor viser i forvejen kun koordinatorens egne
   arrangementer (RLS-afgrænset via state.events), så ingen ekstra filtrering er nødvendig her. */
function viewCoordinatorHome(){
  return `${pickerHeaderHtml()}
    ${actionRequiredSection()}
    <div style="margin:24px 0 10px"><span class="eyebrow">Dine arrangementer</span></div>
    ${pickerEventListHtml()}`;
}
function viewBrugere(){
  return `${consoleNav('users')}
  <div style="margin:20px 0 10px"><span class="eyebrow">Medarbejdere i ${esc(state.orgName||'organisationen')}</span></div>
  <section class="card">
    <header><h2>Medarbejdere</h2><span class="note">${(state.staffList||[]).length}</span></header>
    ${(state.staffList||[]).map(s=>`<div class="stat">
      <span>${esc(s.name)}${s.id===state.userId?' <span class="note">(dig)</span>':''}</span>
      <span class="row" style="gap:8px">
        <select class="status" data-role-user="${s.id}" ${s.id===state.userId?'disabled':''}>
          <option value="coordinator" ${s.role==='coordinator'?'selected':''}>coordinator</option>
          <option value="admin" ${s.role==='admin'?'selected':''}>admin</option>
        </select>
        ${s.id===state.userId?'':`<button class="btn" data-remove-user="${s.id}">Fjern</button>`}
      </span>
    </div>`).join('')}
  </section>
  <section class="card">
    <header><h2>Ventende invitationer</h2><span class="note">${(state.invitesList||[]).length}</span></header>
    ${(state.invitesList||[]).length?(state.invitesList||[]).map(i=>`<div class="stat">
      <span>${esc(i.name)} <span class="note">${esc(i.email)} · ${i.role}</span></span>
      <button class="btn" data-cancel-invite="${i.id}">Fortryd</button>
    </div>`).join(''):'<div class="empty">Ingen ventende invitationer.</div>'}
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <input id="invName" class="search" placeholder="Navn" style="flex:1;min-width:140px">
      <input id="invEmail" class="search" type="email" placeholder="Mail" style="flex:1;min-width:180px">
      <select id="invRole" class="search" style="flex:1;min-width:120px">
        <option value="coordinator">coordinator</option>
        <option value="admin">admin</option>
      </select>
      <button class="btn primary" id="invSend">Invitér</button>
    </div>
    <div class="note" style="margin-top:10px">Der sendes ikke automatisk en mail endnu — giv personen selv besked om at logge ind med denne mail-adresse. Personen bliver automatisk medarbejder med den valgte rolle, første gang de logger ind.</div>
  </section>`;
}

(async function init(){
  const gateSend=document.getElementById('gateSend');
  gateSend.onclick=async(ev)=>{
    const email=document.getElementById('gateEmail').value.trim(); if(!email) return;
    const btn=ev.currentTarget, orig=btn.textContent;
    btn.disabled=true; btn.textContent='Sender…';
    const {error}=await sb.auth.signInWithOtp({email, options:{emailRedirectTo:location.href.split('#')[0]}});
    document.getElementById('gateMsg').textContent = error ? ('Fejl: '+error.message) : ('Tjek din indbakke — vi har sendt et login-link til '+email+'.');
    btn.disabled=false; btn.textContent=orig;
  };
  onEnterSubmit(document.getElementById('gateEmail'), ()=>gateSend.click());

  let gateMode='link';
  const gatePwLogin=document.getElementById('gatePasswordLogin');
  const gateToggle=document.getElementById('gateToggleMode');
  function setGateMode(mode){
    gateMode=mode;
    const isPw = mode==='password';
    gateSend.style.display = isPw?'none':'';
    document.getElementById('gatePassword').style.display = isPw?'':'none';
    gatePwLogin.style.display = isPw?'':'none';
    gateToggle.textContent = isPw ? 'Log ind med magisk link i stedet' : 'Har du et kodeord? Log ind med det i stedet';
    document.getElementById('gateMsg').textContent = isPw ? 'Skriv din mail og dit kodeord.' : 'Skriv din mail — du får et link, du logger ind med. Ingen adgangskode.';
  }
  gateToggle.onclick=()=>setGateMode(gateMode==='password'?'link':'password');
  gatePwLogin.onclick=async()=>{
    const email=document.getElementById('gateEmail').value.trim();
    const password=document.getElementById('gatePassword').value;
    if(!email||!password) return;
    const orig=gatePwLogin.textContent;
    gatePwLogin.disabled=true; gatePwLogin.textContent='Logger ind…';
    const {error}=await sb.auth.signInWithPassword({email,password});
    gatePwLogin.disabled=false; gatePwLogin.textContent=orig;
    if(error) document.getElementById('gateMsg').textContent='Forkert mail eller kodeord.';
  };
  onEnterSubmit(document.getElementById('gatePassword'), ()=>gatePwLogin.click());

  document.getElementById('setPasswordBtn').onclick=()=>{
    document.getElementById('pwNew').value='';
    document.getElementById('pwConfirm').value='';
    document.getElementById('passwordModal').style.display='flex';
  };
  document.getElementById('pwCancel').onclick=()=>{ document.getElementById('passwordModal').style.display='none'; };
  const pwSave=document.getElementById('pwSave');
  pwSave.onclick=async()=>{
    const pw1=document.getElementById('pwNew').value;
    const pw2=document.getElementById('pwConfirm').value;
    if(pw1.length<8){ showToast('Kodeordet skal være mindst 8 tegn.','error'); return; }
    if(pw1!==pw2){ showToast('Kodeordene er ikke ens.','error'); return; }
    const orig=pwSave.textContent;
    pwSave.disabled=true; pwSave.textContent='Gemmer…';
    const {error}=await sb.auth.updateUser({password:pw1});
    pwSave.disabled=false; pwSave.textContent=orig;
    if(error){ showToast('Kunne ikke sætte kodeord: '+error.message,'error'); return; }
    document.getElementById('passwordModal').style.display='none';
    showToast('Kodeord sat. Du kan nu logge ind med det.','ok');
  };
  onEnterSubmit(document.getElementById('pwConfirm'), ()=>pwSave.click());

  document.getElementById('logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  document.getElementById('previewExit').onclick=()=>{
    state.rolle=state.previewPriorRolle||'kilden'; state.previewMode=false; state.previewPriorRolle=null; render();
  };
  document.getElementById('backToList').onclick=()=>{ showPicker(); };
  document.getElementById('switchEvent').onclick=()=>{
    unsubscribeRealtime(); state.eventId=null; state.view='guestPicker'; render();
  };
  const {data:{session}}=await sb.auth.getSession();
  if(session) cloudBoot(session.user); else showGate();
  sb.auth.onAuthStateChange((_e,s)=>{ if(s&&!state.eventId&&state.view!=='picker'&&state.view!=='superadmin') cloudBoot(s.user); });
})();
</script>
