<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12151B; --ink-60:rgba(18,21,27,.60); --ink-40:rgba(18,21,27,.40);
  --line:rgba(18,21,27,.14); --paper:#EAEDE6; --card:#FBFBF9;
  --blue:#1435D6; --amber:#A8681C; --moss:#3E6B4C; --radius:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Familjen Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px 96px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}

.mark{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;color:var(--blue);letter-spacing:-.01em}
.brand{display:flex;flex-direction:column;line-height:1.02;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.brand .org{font-size:12px;font-weight:600;color:var(--ink-60);letter-spacing:.02em;margin-top:1px}
.eventloc{margin-top:8px;font-size:14px;color:var(--ink-60)}
.eventloc .loc{font-weight:600;color:var(--ink)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);font-weight:600}

.rolebar{display:flex;align-items:center;gap:10px}
.consnav{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);margin-bottom:16px}
.consnav button{border:0;background:none;padding:7px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-60)}
.consnav button[aria-pressed="true"]{background:var(--ink);color:#fff}
.whoami{font-size:12px;color:var(--ink-40)}

.hero{margin:28px 0 8px}
.hero h1{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(44px,10vw,84px);line-height:.92;letter-spacing:-.02em;font-weight:400}
.hero .sub{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:99px;background:var(--ink-40)}
.chip.warn{border-color:rgba(168,104,28,.4);color:var(--amber)} .chip.warn .dot{background:var(--amber)}
.chip.ok{border-color:rgba(62,107,76,.35);color:var(--moss)} .chip.ok .dot{background:var(--moss)}
.chip.blue{border-color:rgba(20,53,214,.3);color:var(--blue)} .chip.blue .dot{background:var(--blue)}

/* Ét sammenhængende forløb, ikke fire løse tags — segmenterne er visuelt fusioneret i én bar
   (border-radius sidder på selve .statussteps, ikke på de enkelte .sstep), med tynde skillelinjer
   mellem trinene i stedet for mellemrum. Adskiller bevidst status-forløbet fra .chip-stilen, som
   ellers altid betyder "én isoleret tilstand" — fire chips ved siden af hinanden så ud som fire
   uafhængige tags, ikke ét forløb, og skjulte at trinnene rent faktisk er klikbare. */
.statussteps{display:flex;margin-top:6px;border:1px solid var(--line);border-radius:99px;overflow:hidden;width:fit-content;max-width:100%}
.sstep{appearance:none;-webkit-appearance:none;font-family:inherit;line-height:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:6px 12px;border:0;border-right:1px solid var(--line);color:var(--ink-40);background:var(--card);white-space:nowrap}
.sstep:last-child{border-right:0}
.sstep.done{color:var(--moss);background:rgba(62,107,76,.08)}
.sstep.current{color:#fff;background:var(--blue)}
.sstep.interactive{cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
.sstep.interactive:hover{background:rgba(18,21,27,.08)}
.sstep.current.interactive:hover{filter:brightness(1.1);background:var(--blue)}
.sstep.interactive:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.card > summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;cursor:pointer}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
.fold-chev{display:inline-block;font-size:10px;color:var(--ink-40);transition:transform .15s ease;margin-right:6px}
details[open] > summary .fold-chev,details[open] .fold-chev{transform:rotate(90deg)}
/* Fælles stil for fold-ud-linjer, der ikke er den kompakte .notes-toggle-pille (fx "Uden frist",
   "Udført (N)", grupperede kiggehændelser i loggen) — tidligere var disse kun den lille grå .note-tekst
   med en 10px pil, hvilket gjorde både at man knap kunne SE at linjen kunne foldes ud, og at selve
   klikfladen var alt for lille til at ramme præcist. */
.fold-summary{display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 8px;margin:0 -8px;border-radius:var(--radius);
  font-size:13px;font-weight:600;color:var(--ink-60);transition:background .1s ease,color .1s ease}
.fold-summary:hover{color:var(--ink);background:rgba(18,21,27,.04)}
.fold-summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.fold-summary .fold-chev{font-size:12px;color:inherit}
.notes-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

nav.tabs{display:flex;gap:2px;margin:26px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  background:
    linear-gradient(to right, var(--paper) 50%, rgba(234,237,230,0)),
    linear-gradient(to left, var(--paper) 50%, rgba(234,237,230,0)) 100% 0,
    radial-gradient(farthest-side at 0 50%, rgba(18,21,27,.16), rgba(18,21,27,0)),
    radial-gradient(farthest-side at 100% 50%, rgba(18,21,27,.16), rgba(18,21,27,0)) 100% 0;
  background-repeat:no-repeat; background-color:var(--paper);
  background-size:24px 100%, 24px 100%, 10px 100%, 10px 100%;
  background-position:0 0, 100% 0, 0 0, 100% 0;
  background-attachment:local, local, scroll, scroll;
}
/* Native scrollbar skjules bevidst — kant-gradienterne ovenfor er selve skrolle-indikatoren. En synlig
   OS-scrollbar her lagde ekstra højde ind under fanerne, så bunden af fanebjælken ikke ramte kortets
   border-bottom præcist (det så ud som om "noget med højden ikke passede"). */
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-60);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
nav.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card .note{font-size:13px;color:var(--ink-60)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:720px){.kpigrid{grid-template-columns:1fr 1fr}}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:16px}

.num{font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
.big{font-family:'Instrument Serif',serif;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

.recon{margin-top:14px;border-left:3px solid var(--blue);background:rgba(20,53,214,.05);padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0}
.recon.off{border-left-color:var(--amber);background:rgba(168,104,28,.07)}
.recon .t{font-weight:700;font-size:14px}
.recon .d{font-size:13px;color:var(--ink-60);margin-top:2px}

.item{display:grid;grid-template-columns:3px 1fr auto;gap:14px;align-items:start;border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.stripe{align-self:stretch;border-radius:99px;background:var(--ink-40)}
.stripe.jer{background:var(--blue)} .stripe.kilden{background:var(--ink)}
.item .name{font-weight:600;font-size:15px}
.item .meta{font-size:12.5px;color:var(--ink-60);margin-top:2px}
.item .meta .due{color:var(--amber);font-weight:600}
.item .meta .due.past{text-decoration:underline}
select.status{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:5px 8px;font-size:13px}
select.status:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input[type=text]{width:100%;border:0;background:transparent;padding:3px 0}
.tbl input[type=text]:focus{outline:0;border-bottom:1px solid var(--blue)}
.tbl select{border:0;background:transparent;padding:2px}
.tbl td.c{text-align:center;width:70px}
.tbl .del{border:0;background:none;color:var(--ink-40);cursor:pointer;font-size:16px;line-height:1;min-width:32px;min-height:32px}
.tbl .del:hover{color:var(--amber)}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.scroll{overflow-x:auto}

.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .1s ease,filter .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.55;cursor:default;pointer-events:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:14px;background:#fff;min-width:180px}
.empty{color:var(--ink-60);font-size:14px;padding:14px 0}

/* --- staff log --- */
.logfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.logfilters select{border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:13px;background:#fff}
.logrow{display:grid;grid-template-columns:120px 128px 1fr;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.logrow:last-child{border-bottom:0}
.logrow .when{font-variant-numeric:tabular-nums;color:var(--ink-60);font-size:12.5px}
.logrow .who{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px}
.logrow .who .dot{width:7px;height:7px;border-radius:99px}
.logrow .who .dot.kilden{background:var(--ink)} .logrow .who .dot.kunde{background:var(--blue)}
.logrow .what .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-40);font-weight:600;margin-right:8px}
.logrow .what .view{color:var(--ink-40)}
.logrow .delta{font-variant-numeric:tabular-nums}
.logrow .delta .arrow{color:var(--ink-40);margin:0 5px}
.logrow.viewrow{opacity:.72}

/* --- customer timeline --- */
.tl{position:relative;margin-top:6px;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tlday{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40);font-weight:600;margin:18px 0 8px}
.tlday:first-child{margin-top:0}
.tlitem{position:relative;padding:6px 0 10px}
.tlitem:before{content:"";position:absolute;left:-21px;top:11px;width:9px;height:9px;border-radius:99px;background:var(--card);border:2px solid var(--blue)}
.tlitem.kilden:before{border-color:var(--ink)}
.tlitem .txt{font-size:15px}
.tlitem .by{font-size:12.5px;color:var(--ink-60);margin-top:1px}

/* --- beskeder (tråd, ikke chat) --- */
.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.compose{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:12px;margin-bottom:8px}
.compose textarea{width:100%;border:0;resize:vertical;min-height:60px;font:inherit;outline:0;line-height:1.45}
.compose .crow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.compose .hint{font-size:12px;color:var(--ink-40);max-width:60%}
.msg{border-left:3px solid var(--ink);border-radius:0 var(--radius) var(--radius) 0;background:#fff;padding:11px 14px;margin:10px 0}
.msg.kunde{border-left-color:var(--blue)}
.msg.internal{background:rgba(168,104,28,.06);border-left-color:var(--amber)}
.msg .mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.msg .mwho{font-weight:600;font-size:13.5px}
.msg .mtime{font-size:12px;color:var(--ink-40);font-variant-numeric:tabular-nums;white-space:nowrap}
.msg .mtext{font-size:14.5px;white-space:pre-wrap;line-height:1.5}
.logrow .msgq{font-style:italic}

footer.legal{margin-top:28px;font-size:12px;color:var(--ink-40);line-height:1.6}

#superadminBar{background:var(--ink);border-bottom:3px solid var(--amber)}
#previewBar{background:var(--ink);border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:45}
#previewBar .sabar-label{color:var(--blue)}
/* Kun visuel: den faktiske spærre er applyPreviewReadOnly() (readonly/disabled/fjernede knapper på de konkrete
   skrivende felter) + mutate()-spærren ved selve databasekaldet. Ingen blanket pointer-events:none her længere —
   det blokerede tidligere ALT i visningen, inkl. søgning og fold-ud, som skal forblive brugbart i forhåndsvisning. */
.preview-locked input[readonly],.preview-locked textarea[readonly]{background:var(--paper);color:var(--ink-60);cursor:default}
.preview-locked select:disabled,.preview-locked input:disabled{opacity:.55;cursor:not-allowed}
.sabar-inner{max-width:960px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sabar-label{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber)}
.sabar-label #sabarOrg{color:rgba(234,237,230,.65);font-weight:600;text-transform:none;letter-spacing:0}
.sabar-label #sabarActorNote{color:var(--amber);font-weight:700;text-transform:none;letter-spacing:0}
.sabar-btn{background:rgba(234,237,230,.08);border-color:rgba(234,237,230,.25);color:rgba(234,237,230,.85)}
#sabarActorSelect option{background:var(--ink);color:#fff}
.sabar-btn:hover{border-color:var(--amber);color:#fff}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;border:0;border-radius:99px;background:var(--blue);color:#fff;
  font-weight:700;font-size:14px;padding:13px 20px;box-shadow:0 4px 14px rgba(18,21,27,.25);cursor:pointer;
  transition:transform .1s ease,filter .15s ease}
.fab:hover{filter:brightness(1.1)}
.fab:active{transform:scale(.96)}

/* toast + bekræft-modal (erstatter alert/confirm) */
#toastWrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 16px;width:100%;max-width:420px}
.toast{background:var(--ink);color:#fff;border-radius:var(--radius);padding:12px 16px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 20px rgba(18,21,27,.3);animation:toastin .2s ease both;max-width:100%}
.toast.error{background:#5C1A1A}
.toast.ok{background:var(--moss)}
.toast .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;padding:5px 10px;font-size:12.5px}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#confirmModal{display:none;position:fixed;inset:0;background:rgba(18,21,27,.45);z-index:65;align-items:center;justify-content:center;padding:20px}
#confirmModal .box{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
#confirmModal p{font-size:14.5px;line-height:1.5;margin:0 0 18px}

/* felt-labels */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;color:var(--ink-40);letter-spacing:.03em;text-transform:uppercase}
.field select,.field input{width:100%}

/* formular med flere felter, pænt justeret i grid i stedet for flex (undgår hulter-til-bulter ombrydning) */
.formgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:12px 14px;align-items:end}
.formgrid .full{grid-column:1/-1}
.formgrid .btn{grid-column:1/-1;justify-self:end}
input[type=file].search{padding:6px 8px;font-size:13px;min-width:0}

/* gemt-feedback på inline-redigering */
.flash-saved{background:rgba(62,107,76,.16)!important;transition:background .7s ease}
.field-saving{opacity:.6;border-color:var(--amber)!important}

/* opgave-noter og filer */
.tasknote{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tnhead{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12.5px}
.tnfile{font-size:12.5px;padding:4px 10px}
.notes-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;cursor:pointer}
.notes-toggle:hover{border-color:var(--blue);color:var(--blue)}
.notes-toggle .fold-chev{margin-right:0;color:inherit}
.notes-badge{background:var(--blue);color:#fff;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
.notes-wrap{grid-column:1/-1;margin-top:10px;padding-top:10px;border-top:1px dotted var(--line)}

/* loading-skærm */
#bootLoading{position:fixed;inset:0;background:var(--paper);z-index:90;display:flex;align-items:center;justify-content:center}

/* Mobil bundnavigation: fire faste destinationer (Dag/Oversigt, Opgaver, Beskeder, Mere) i stedet for
   den vandret-scrollende fanebjælke, som er svær at ramme præcist med tommelfingeren. Kun til stede
   under 640px — over det er den vandrette fanebjælke selv fin at bruge, og en fast bundbjælke ville
   bare tage plads væk fra indholdet uden grund. */
.mobile-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--card);border-top:1px solid var(--line);
  display:none;box-shadow:0 -4px 14px rgba(18,21,27,.08)}
.mobile-bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:56px;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--ink-40);cursor:pointer;position:relative}
.mobile-bottom-nav button.active{color:var(--blue)}
.mobile-bottom-nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.mobile-bottom-nav .mbn-icon{font-size:18px;line-height:1}
.mobile-bottom-nav .mbn-badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--amber);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:15px}
@media(max-width:640px){
  .mobile-bottom-nav.mbn-active{display:flex}
  body.has-mobile-nav .wrap{padding-bottom:64px}
  body.has-mobile-nav .fab{bottom:calc(72px + env(safe-area-inset-bottom))}
}
@media print{body{background:#fff} nav.tabs,.btn,.row.noprint,.rolebar,#superadminBar,#previewBar,.fab,#toastWrap,#bootLoading,.mobile-bottom-nav{display:none!important} .card{border:0;padding:0;margin-bottom:22px}
  .tbl input[type=text]{border:0;background:none} .tbl select{border:0;background:none;-webkit-appearance:none;appearance:none}}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .32s ease both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* 44×44px minimum berøringsflade (WCAG 2.5.5 / Apple HIG) op til og med tablet-bredde. Det visuelle
   ikon/tekst må gerne forblive lille — det er selve klik-/tap-fladen, der skal op på 44px, ikke
   nødvendigvis skriftstørrelsen. Bevidst ikke en blanket "button,input{min-height:44px}"-regel, da det
   ville forstørre almindelige tekstfelter (.search) unødigt — kun de konkrete kontroltyper, som

<script>
/* =========================================================
   1. DATA
   ========================================================= */
const DAG = 86400000;

/* =========================================================
   2. KONFIGURATION
   Project URL + anon-nøgle. anon er ikke hemmelig — må gerne committes.
   ========================================================= */
const SUPA = { url:'https://bksaazivbzgxzmgzhbqu.supabase.co', anon:'sb_publishable_y81wiQGZXEzwxO56U7BSFg_A2fwkaXg' };   // ← Supabase → Project Settings → API
const sb = window.supabase.createClient(SUPA.url, SUPA.anon);

let state = { gaester:[], punkter:[], log:[],
              tab:'oversigt', soeg:'', rolle:'kilden', logType:'alle', logWho:'alle', logArea:'alle',
              logDays:'14', logFrom:'', logTo:'', logSearch:'', logShowTech:false,
              lastRead:{kilden:0, kunde:0}, phases:[], venueRooms:[], staffList:[], invitesList:[], venuesFull:[],
              venueDetailId:null, venueUpcomingCounts:{}, venueDetailEvents:[], venueDetailRoomEvents:{},
              eventCatalog:[], orgCatalog:[], newCatalogItemRoomIds:[],
              openPickerGroups:new Set(['kladde','tilbud','bekræftet']),
              isSuperadmin:false, isSuperadminOwner:false, viewAsCoordinator:false, allOrgs:[], superadmins:[], superadminInvites:[], guestLink:'', guestLinkEventId:null, guestLinkBusy:false,
              guestWelcome:false, contactName:'', orgOnboardingDismissed:false, orgCatalogCount:0, orgStaffCount:0,
              taskTemplates:[], agendaNotes:{}, openTaskNotes:new Set(), openDoneGroups:new Set(), openSetupFolds:new Set(),
              superadminActor:null, impersonating:null, roster:[],
              previewMode:false, previewPriorRolle:null,
              eventExceptions:{}, eventNextDue:{}, pickerSort:'dato', pickerSearch:'', pickerFilterStatus:'alle',
              pickerExceptionsLoading:false, pickerExceptionsError:false,
              approvals:[], changeRequests:[], modal:null,
              orgTemplates:[], guestSel:new Set(), guestBulkFilter:{kat:'alle', reception:'alle', middag:'alle', kost:'alle'},
              inboxFilter:JSON.parse(localStorage.getItem('verta_inbox_filter')||'{"who":"alle","kind":"alle"}'),
              inboxSort:localStorage.getItem('verta_inbox_sort')||'prioritet',
              pickerMineOnly:localStorage.getItem('verta_picker_mine')==='1',
              logCollapseViews:true, openLogViewGroups:new Set(), calendarRange:'uge', calendarDate:null, docPreview:null };
/* Generisk modal-dispatch: hver feature (dublikering, skabeloner, import, godkendelser, massehandling,
   overdragelse, "Mere"-menuen) registrerer en renderer + evt. binder under sin egen nøgle i disse to
   tabeller, i stedet for én kæmpe if/else. state.modal={type,...data} er den eneste kilde til hvilken
   modal der er åben. Erklæret her, tidligt i scriptet — flere features tilføjer deres
   MODAL_RENDERERS.xxx/MODAL_BINDERS.xxx et godt stykke længere nede i filen, men da det blot er
   property-tildelinger (ikke funktionsdeklarationer), skal selve objekterne være initialiseret,
   FØR scriptet når derned, ellers rammer den første tildeling en ReferenceError (TDZ) og hele
   scriptet stopper med at køre. (Præcis den fejl var der reelt indtil denne rettelse.) */
const MODAL_RENDERERS = {};
const MODAL_BINDERS = {};
/* Rigtig UUID til klient-oprettede rækker (guests.id er en uuid-kolonne — et 'n'+Date.now()-agtigt id ville få hele upsert-batchen til at fejle stille). */
function newId(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});
}
function save(){ return cloudSaveGuestsAgenda(); }
const currentActor = () => state.actor||{navn:'?',side:'kilden'};

/* =========================================================
   UI-hjælpere: toast + bekræft-modal (erstatter alert/confirm), Enter-taste
   ========================================================= */
function showToast(msg, kind, action){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:'');
  /* role="alert" giver implicit aria-live="assertive" for fejl (skal afbryde og læses straks); success/info
     læner sig op ad #toastWrap's egen aria-live="polite" (venter til skærmlæseren er færdig med andet). */
  if(kind==='error') t.setAttribute('role','alert');
  if(action && action.label){
    const span=document.createElement('span'); span.textContent=msg;
    const btn=document.createElement('button'); btn.className='btn'; btn.type='button'; btn.textContent=action.label;
    btn.style.marginLeft='10px';
    btn.onclick=()=>{ t.remove(); action.onClick(); };
    t.appendChild(span); t.appendChild(btn);
    setTimeout(()=>t.remove(), 8000);
  } else {
    t.textContent=msg;
    setTimeout(()=>t.remove(), 4200);
  }
  wrap.appendChild(t);
}
function appConfirm(msg){
  return new Promise(resolve=>{
    document.getElementById('confirmMsg').textContent=msg;
    const modal=document.getElementById('confirmModal');
    modal.style.display='flex';
    const ok=document.getElementById('confirmOk'), cancel=document.getElementById('confirmCancel');
    const cleanup=result=>{ modal.style.display='none'; ok.onclick=null; cancel.onclick=null; resolve(result); };
    ok.onclick=()=>cleanup(true);
    cancel.onclick=()=>cleanup(false);
  });
}
/* ==== Central preview-spærre =====================================================
   ALLE skrivende Supabase-kald (insert/update/upsert/delete/storage-upload/edge-function-
   invoke, der opretter adgang) SKAL pakkes i mutate(() => ...). Den er den eneste autoritative
   spærre: den ligger ved selve databasekaldet, ikke kun i en DOM-eventhandler, så en overset
   knap/felt aldrig kan skrive, selv hvis dens egen UI-deaktivering skulle mangle eller fejle.
   Tanken (og fejlen, den retter): et debounced tekstfelt-gem gik tidligere direkte til
   cloudSaveGuestsAgenda() uden om nogen preview-check overhovedet.
   thunk kaldes KUN, hvis vi rent faktisk må skrive — i preview bliver Supabase-forespørgslen
   derfor aldrig konstrueret/afsendt, ikke bare "annulleret" efter afsendelse. Returformen
   matcher Supabases egen {data,error}, så al eksisterende fejlhåndtering (som allerede
   tjekker `if(error)`) fanger spærringen uden ekstra kode ved hvert kaldested. */
function assertCanMutate(){
  return !state.previewMode;
}
async function mutate(thunk){
  if(!assertCanMutate()){
    return {data:null, error:{message:'Ændringer er deaktiveret i kunde-forhåndsvisning.', code:'PREVIEW_READONLY'}};
  }
  return await thunk();
}
/* UI-lag oven på mutate(): rent visuelt/UX — gør de kendte skrivende felter i kunde-visningen
   synligt låste (readonly/disabled/fjernet), så forhåndsvisningen ikke inviterer til forsøg på
   at skrive. Selve spærren er stadig mutate() ovenfor; denne funktion kan aldrig være den eneste
   linje, der forhindrer et skriv. Kører efter hvert render() i preview-mode. Målrettet mod de
   konkrete felter/knapper, der findes i kunde-visningens faner (gæster, punkter, beskeder) —
   IKKE en blanket input-regel, da det ville låse søgefelter og eksport-vælgere, der skal forblive
   brugbare (rene læse-interaktioner). */
function applyPreviewReadOnly(){
  if(!state.previewMode) return;
  const root=document.getElementById('view');
  if(!root) return;
  root.querySelectorAll('[data-f="navn"], [data-f="kost"]').forEach(el=>{ el.readOnly=true; });
  root.querySelectorAll('[data-f="kat"], [data-f="reception"], [data-f="middag"]').forEach(el=>{ el.disabled=true; });
  const tilfoej=document.getElementById('tilfoej'); if(tilfoej) tilfoej.remove();
  root.querySelectorAll('[data-slet]').forEach(el=>el.remove());
  root.querySelectorAll('[data-punkt-done], [data-punkt-undo]').forEach(el=>{ el.disabled=true; });
  root.querySelectorAll('[data-note-text]').forEach(el=>{ el.readOnly=true; });
  root.querySelectorAll('[data-note-file]').forEach(el=>{ el.disabled=true; });
  root.querySelectorAll('[data-note-send]').forEach(el=>{ el.disabled=true; });
  const msgtext=document.getElementById('msgtext'); if(msgtext) msgtext.readOnly=true;
  const sendmsg=document.getElementById('sendmsg'); if(sendmsg) sendmsg.disabled=true;
}
function onEnterSubmit(el, fn){
  if(!el) return;
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); fn(); } });
}
function onEnterBlur(el){
  if(!el) return;
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
}
function flashSaved(selector){
  const el=document.querySelector(selector);
  if(!el) return;
  el.classList.add('flash-saved');
  setTimeout(()=>el.classList.remove('flash-saved'),900);
}

/* =========================================================
   3. LOG
   ========================================================= */
function pushLog({area,label,from='',to='',cust=false,friendly=''}){
  const a=currentActor();
  const ev={id:'e'+Date.now()+Math.random().toString(36).slice(2,5), ts:Date.now(),
    side:a.side, who:a.navn, type:'change', area, label, from:String(from), to:String(to), cust, friendly, text:''};
  state.log.unshift(ev);
  mutate(()=>sb.from('activity_log').insert(logToDb(ev)).then(({error})=>error&&console.error('log',error)));
}
/* "Intern note" genbruger den eksisterende beskedstråd, men indsættes med entry_type='note' i stedet
   for 'message' — RLS'ens log_read_guest kræver enten entry_type='message' eller customer_visible=true,
   så en note med customer_visible=false er dermed usynlig for gæsten helt uden skemaændring. Kun staff
   kan oprette dem (UI-lag), men selv et direkte API-misbrug fra en gæst ville blot skabe en note, gæsten
   ikke selv kan læse igen — ingen datalækage. */
function pushMessage(text, internal){
  const a=currentActor();
  const ev={id:'m'+Date.now(), ts:Date.now(), side:a.side, who:a.navn,
    type: internal?'note':'message', area:'system', text:text.trim(), from:'', to:'', cust:false, friendly:''};
  state.log.unshift(ev);
  if(!internal) state.lastRead[a.side]=Date.now();
  mutate(()=>sb.from('activity_log').insert(logToDb(ev)).then(({error})=>error&&console.error('msg',error)));
  /* v2: her udløser en Edge Function en mail til den anden part, jf. roadmap */
}
const unread = rolle => { const last=state.lastRead[rolle]||0;
  return state.log.filter(e=>e.type==='message'&&e.side!==rolle&&e.ts>last).length; };

/* =========================================================
   4. BEREGNINGER
   ========================================================= */
const kr = n => n.toLocaleString('da-DK')+' kr.';
function dageTil(iso){ return Math.ceil((new Date(iso+'T00:00:00')-nowDate())/DAG); }
function datoKort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'}); }

function antal(){
  const g=state.gaester, t=k=>({
    voksne:g.filter(x=>x[k]&&x.kat==='voksen').length,
    boern: g.filter(x=>x[k]&&x.kat==='barn').length,
    babyer:g.filter(x=>x[k]&&x.kat==='baby').length });
  const r=t('reception'), m=t('middag');
  r.total=r.voksne+r.boern+r.babyer; m.total=m.voksne+m.boern+m.babyer;
  return {reception:r, middag:m};
}
function prisLinjer(){
  const a=antal();
  return (state.eventCatalog||[]).map(p=>{
    if(p.grundlag==='fast') return {...p,stk:1,belob:p.sats,grundlagTxt:'fast beløb'};
    const b=a[p.grundlag];
    const v=b.voksne*p.sats, bo=p.boernHalv?b.boern*(p.sats/2):b.boern*p.sats;
    return {...p,stk:b.voksne+b.boern,belob:v+bo,
      grundlagTxt:b.voksne+' voksne'+(b.boern?' + '+b.boern+' børn til halv pris':'')+' · babyer gratis'};
  });
}
const total = () => prisLinjer().reduce((s,l)=>s+l.belob,0);
const aabnePunkter = () => state.punkter.filter(p=>p.status!=='aftalt');

/* mutation-wrapper: opdaterer optimistisk, men ruller tilbage og viser en fejl, hvis Supabase afviser ændringen.
   Genhenter den autoritative gæsteliste efter et bekræftet gem, så alle visninger altid stemmer overens med databasen. */
function restoreGuestFocus(sel){
  if(!sel) return;
  const el=document.querySelector(`tr[data-id="${sel.id}"] [data-f="${sel.f}"]`);
  if(el) el.focus();
}
async function guestMutation(apply, staffLabel){
  const active=document.activeElement;
  const focusSel = (active && active.dataset && active.dataset.f && active.closest('tr'))
    ? {id:active.closest('tr').dataset.id, f:active.dataset.f} : null;
  const snapshot = state.gaester.map(g=>({...g}));
  const b=antal(); apply(); const a=antal();
  render();
  restoreGuestFocus(focusSel);
  try{
    await save();
    pushLog({area:'gaester', label:staffLabel});
    if(a.middag.total!==b.middag.total)
      pushLog({area:'gaester',label:'Deltagerantal (middag)',from:b.middag.total,to:a.middag.total,cust:true,friendly:'Deltagerantal til middag opdateret til '+a.middag.total});
    else if(a.reception.total!==b.reception.total)
      pushLog({area:'gaester',label:'Deltagerantal (reception)',from:b.reception.total,to:a.reception.total,cust:true,friendly:'Deltagerantal til reception opdateret til '+a.reception.total});
    await reloadGaester();
    render();
    restoreGuestFocus(focusSel);
  }catch(err){
    state.gaester=snapshot;
    render();
    restoreGuestFocus(focusSel);
    showToast('Kunne ikke gemme ændringen: '+(err.message||'ukendt fejl'),'error');
  }
}
/* Tekstfelter (navn, kost) gemmer debounced uden at gen-rendere hele tabellen — undgår at brugeren mister
   fokus/markørposition midt i indtastning. Værdien er allerede opdateret lokalt via oninput; her afventes
   blot det faktiske gem, og feltet ruller tilbage til sidst kendte gode værdi, hvis Supabase afviser det. */
const guestFieldTimers = {};
const pendingGuestEdits = {};
function scheduleGuestFieldSave(g, f, el){
  const key=g.id+'|'+f;
  pendingGuestEdits[key]={value:g[f]};
  clearTimeout(guestFieldTimers[key]);
  guestFieldTimers[key]=setTimeout(()=>commitGuestField(g.id,f,el), 550);
}
async function commitGuestField(guestId, f, el){
  const key=guestId+'|'+f;
  clearTimeout(guestFieldTimers[key]);
  const g=state.gaester.find(x=>x.id===guestId);
  if(!g){ delete pendingGuestEdits[key]; return; }
  const before = el.dataset.lastGood;
  const value = g[f];
  if(value===before){ delete pendingGuestEdits[key]; return; }
  el.classList.add('field-saving');
  try{
    await save();
    if(f==='kost') pushLog({area:'gaester',label:'Særlig kost · '+g.navn,from:before||'—',to:value||'—',cust:true,friendly:'Særlig kost opdateret for '+(g.navn||'en gæst')+(value?' ('+value+')':'')});
    else pushLog({area:'gaester',label:'Navn ændret',from:before||'—',to:value||'—'});
    delete pendingGuestEdits[key];
    if(document.body.contains(el)) el.dataset.lastGood = value;
    el.classList.remove('field-saving');
    flashSaved(`tr[data-id="${guestId}"] [data-f="${f}"]`);
  }catch(err){
    el.classList.remove('field-saving');
    delete pendingGuestEdits[key];
    g[f]=before;
    if(document.body.contains(el)) el.value=before;
    showToast('Kunne ikke gemme '+(f==='kost'?'kostbehov':'navn')+': '+(err.message||'ukendt fejl'),'error');
  }
}

async function matchOfferToComputed(){
  const t=total();

  if(error){ showToast('Kunne ikke opdatere tilbuddet: '+error.message,'error'); return; }
  state.offerTotal=t;
  pushLog({area:'system', label:'Tilbud tilpasset', cust:true, friendly:'Tilbudsbeløbet blev tilpasset til den beregnede pris ('+kr(t)+')'});

  </div>`;

async function submitGuestChangeRequest(){
  const guestId=document.getElementById('crGuest').value;
  const del=document.getElementById('crDelete').checked;
  const g={
    id: guestId||newId(),
    navn: document.getElementById('crNavn').value.trim(),
    kat: document.getElementById('crKat').value,
    reception: document.getElementById('crReception').checked,
    middag: document.getElementById('crMiddag').checked,
    kost: document.getElementById('crKost').value.trim()
  };
  const before=guestId ? state.gaester.find(x=>x.id===guestId) : null;
  if(!del && !g.navn){ showToast('Skriv et navn.','error'); return; }
  if(del && !before){ showToast('Vælg en eksisterende gæst for at fjerne.','error'); return; }
  const action = del?'delete':(guestId?'update':'insert');
  const nextGuests = action==='delete' ? state.gaester.filter(x=>x.id!==guestId)
    : action==='update' ? state.gaester.map(x=>x.id===guestId?{...x,navn:g.navn,kat:g.kat,reception:g.reception,middag:g.middag,kost:g.kost}:x)
    : [...state.gaester, g];
  const priceBefore=total(), priceAfter=computeTotalForGuests(nextGuests);
  const row={
    event_id: state.eventId, requested_by: state.userId, requested_by_role:'kunde', requested_by_name: currentActor().navn,
    change_type:'guest_edit', before_payload: before?{guest:{id:before.id,navn:before.navn,kat:before.kat,reception:before.reception,middag:before.middag,kost:before.kost}}:null,
    after_payload: {action, guest: action==='delete'?{id:guestId, navn:before.navn}:g},
    price_before: priceBefore, price_after: priceAfter, price_delta: priceAfter-priceBefore,
    comment: document.getElementById('crComment').value.trim()||null
  };
  const {error}=await mutate(()=>sb.from('event_change_requests').insert(row));
  if(error){ showToast('Kunne ikke sende forslaget: '+error.message,'error'); return; }
  pushLog({area:'gaester', label:'Ændringsforslag', cust:true, friendly:'Nyt ændringsforslag til gæstelisten sendt'});
  await loadChangeRequests(state.eventId); render();
  showToast('Forslag sendt.','ok');
}
async function acceptChangeRequest(id){
  const c=(state.changeRequests||[]).find(x=>x.id===id); if(!c) return;
  if(!(await appConfirm('Acceptér forslaget? Gæstelisten opdateres med det samme.'))) return;
  const {error}=await mutate(()=>sb.rpc('apply_change_request',{p_id:id}));
  if(error){ showToast('Kunne ikke acceptere: '+error.message,'error'); return; }
  pushLog({area:'gaester', label:'Ændringsforslag accepteret', cust:true, friendly:changeRequestSummary(c)+' blev accepteret'});
  await Promise.all([loadChangeRequests(state.eventId), reloadGaester()]); render();
  showToast('Accepteret og gæstelisten opdateret.','ok');
}
async function rejectChangeRequest(id){
  const c=(state.changeRequests||[]).find(x=>x.id===id); if(!c) return;
  if(!(await appConfirm('Afvis forslaget? Gæstelisten forbliver uændret.'))) return;
  let staffName=currentActor().navn;
  const {error}=await mutate(()=>sb.from('event_change_requests').update({status:'rejected', reviewed_by:state.userId, reviewed_by_name:staffName, reviewed_at:new Date().toISOString()}).eq('id',id));
  if(error){ showToast('Kunne ikke afvise: '+error.message,'error'); return; }
  pushLog({area:'gaester', label:'Ændringsforslag afvist', cust:true, friendly:changeRequestSummary(c)+' blev afvist'});
  await loadChangeRequests(state.eventId); render();
}
async function createApprovalFromChangeRequest(id){
  const c=(state.changeRequests||[]).find(x=>x.id===id); if(!c) return;
  const id2=await createOrReviseApproval({
    title:'Prisændring pga. ændringsforslag', approval_type:'prisaendring',
    description:changeRequestSummary(c).replace(/<[^>]+>/g,''),
    amount: c.price_after, send:true
  }, null);
  if(id2){ state.tab='punkter'; render(); showToast('Godkendelse oprettet og sendt.','ok'); }

   GÆSTEIMPORT (CSV) + MASSEHANDLINGER
   ========================================================= */
function parseCsvText(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const sample=text.slice(0,400);
  const delim=(sample.split(';').length>sample.split(',').length)?';':',';
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===delim){ row.push(field); field=''; }
      else if(c==='\r'){ /* håndteres af \n */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
function guessColumnIndex(headerRow, patterns){
  const lower=headerRow.map(h=>(h||'').toLowerCase().trim());
  for(const p of patterns){
    const idx=lower.findIndex(h=>h.includes(p));
    if(idx!==-1) return idx;
  }
  return -1;
}
function normalizeCategoryImport(v){
  const s=(v||'').toLowerCase().trim();
  if(['barn','child','børn','kid'].some(x=>s.includes(x))) return 'barn';
  if(['baby','spæd','infant'].some(x=>s.includes(x))) return 'baby';
  return 'voksen';
}
function parseBoolImport(v, def){
  if(v==null||String(v).trim()==='') return def;
  const s=String(v).toLowerCase().trim();
  if(['ja','yes','true','1','x','y'].includes(s)) return true;
  if(['nej','no','false','0','n'].includes(s)) return false;
  return def;
}
const DIET_KEYWORDS = {vegetar:['vegetar'], vegansk:['vegan'], glutenfri:['gluten'], laktosefri:['laktose','mælk','mælkefri'], noedder:['nød','nødde','peanut','jordnød']};
/* Kost er fritekst — normaliseringen er en gruppering til overblik, ikke en medicinsk garanti.
   Den oprindelige tekst vises altid ved siden af, så intet fortolkes usynligt. */
function dietTags(text){
  const s=(text||'').toLowerCase();
  const tags=[];
  for(const [tag,words] of Object.entries(DIET_KEYWORDS)) if(words.some(w=>s.includes(w))) tags.push(tag);
  if(!tags.length && s.trim()) tags.push('andet');
  return tags;
}
const DIET_TAG_LABEL={vegetar:'Vegetar', vegansk:'Vegansk', glutenfri:'Glutenfri', laktosefri:'Laktosefri', noedder:'Nøddeallergi', andet:'Andre behov'};
function downloadImportTemplate(){
  const head=['Navn','Kategori','Reception','Middag','Særlig kost'];
  const example=[['Sofie Hansen','voksen','Ja','Ja',''],['Lille Emma','barn','Ja','Nej','Glutenfri']];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv=[head,...example].map(r=>r.map(q).join(';')).join('\r\n');
  downloadBlob(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}), 'gaesteimport-skabelon.csv');
}
function normNameForDupe(s){ return (s||'').toLowerCase().trim().replace(/\s+/g,' '); }
function buildImportPreview(rows){
  if(!rows.length) return {header:[], mapping:{}, parsed:[]};
  const header=rows[0];
  const mapping={
    navn: guessColumnIndex(header,['navn','name']),
    kat: guessColumnIndex(header,['kategori','category']),
    reception: guessColumnIndex(header,['reception']),
    middag: guessColumnIndex(header,['middag','dinner']),
    kost: guessColumnIndex(header,['kost','diæt','diet','allerg'])
  };
  const existingByName={}; state.gaester.forEach(g=>{ existingByName[normNameForDupe(g.navn)]=g; });
  const parsed=rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map((r,i)=>{
    const navn=(mapping.navn>=0?r[mapping.navn]:'').trim();
    const kat=normalizeCategoryImport(mapping.kat>=0?r[mapping.kat]:'');
    const reception=parseBoolImport(mapping.reception>=0?r[mapping.reception]:null, true);
    const middag=parseBoolImport(mapping.middag>=0?r[mapping.middag]:null, true);
    const kost=(mapping.kost>=0?r[mapping.kost]:'').trim();
    const dupe=navn?existingByName[normNameForDupe(navn)]:null;
    const errors=[];
    if(!navn) errors.push('Mangler navn');
    return {rowNum:i+2, navn, kat, reception, middag, kost, errors, duplicateOf: dupe?dupe.id:null, duplicateName: dupe?dupe.navn:null};
  });
  return {header, mapping, parsed};
}

function simulateImportGuests(preview, dupStrategy){
  let list=state.gaester.slice();
  preview.parsed.filter(r=>!r.errors.length).forEach(r=>{
    if(r.duplicateOf){
      if(dupStrategy==='update') list=list.map(g=>g.id===r.duplicateOf?{...g,kat:r.kat,reception:r.reception,middag:r.middag,kost:r.kost}:g);
      // 'skip' → uændret
    } else {
      list=list.concat([{id:newId(),navn:r.navn,kat:r.kat,reception:r.reception,middag:r.middag,kost:r.kost}]);
    }
  });
  return list;
}

/* Massehandlinger: state.guestSel er en Set af markerede gæste-id'er. */
function bulkGuestFiltered(){
  const f=state.guestBulkFilter||{};
  let rows=state.gaester;
  if(f.kat && f.kat!=='alle') rows=rows.filter(g=>g.kat===f.kat);
  if(f.reception && f.reception!=='alle') rows=rows.filter(g=>g.reception===(f.reception==='ja'));
  if(f.middag && f.middag!=='alle') rows=rows.filter(g=>g.middag===(f.middag==='ja'));
  if(f.kost==='ingen') rows=rows.filter(g=>!g.kost.trim());
  else if(f.kost && f.kost!=='alle') rows=rows.filter(g=>dietTags(g.kost).includes(f.kost));
  if(f.dup){
    const seen={}; state.gaester.forEach(g=>{ const k=normNameForDupe(g.navn); seen[k]=(seen[k]||0)+1; });
    rows=rows.filter(g=>seen[normNameForDupe(g.navn)]>1);
  }
  return rows;
}

    + `<div style="margin:24px 0 10px"><span class="eyebrow">Godkendelser</span></div>`
    + godkendelserSection();
}

async function loadApprovals(eventId){
  const {data,error}=await sb.from('event_approvals').select('*').eq('event_id',eventId).order('created_at',{ascending:false});
  if(error){ console.error('approvals',error); state.approvals=[]; return; }

}
function pendingApprovalsCount(){ return (state.approvals||[]).filter(a=>a.status==='afventer').length; }
function approvalVisibleTo(a){
  // Gæsten må aldrig se en kladde — den er ikke sendt endnu. Staff ser alt (inkl. kladder og historik).
  return state.rolle==='kilden' || a.status!=='kladde';

async function createOrReviseApproval(form, priorId){
  const title=(form.title||'').trim();
  if(!title){ showToast('Skriv en titel.','error'); return null; }
  const row={
    event_id: state.eventId, title, description: form.description||'', approval_type: form.approval_type||'andet',
    amount: form.amount? Number(form.amount): null, due_at: form.due_at? new Date(form.due_at+'T23:59:59').toISOString(): null,
    payload: form.payload||null, status: form.send?'afventer':'kladde',
    requested_by: form.send? state.userId: null, requested_by_name: form.send? currentActor().navn: null,
    requested_at: form.send? new Date().toISOString(): null
  };
  if(priorId){
    const prior=(state.approvals||[]).find(a=>a.id===priorId);
    row.version=(prior?prior.version:1)+1;
  }
  const {data,error}=await mutate(()=>sb.from('event_approvals').insert(row).select('id').single());
  if(error){ showToast('Kunne ikke gemme godkendelsen: '+error.message,'error'); return null; }
  if(priorId){
    const {error:supErr}=await mutate(()=>sb.from('event_approvals').update({status:'erstattet', superseded_by:data.id}).eq('id',priorId));
    if(supErr) showToast('Ny version oprettet, men den gamle kunne ikke markeres som erstattet: '+supErr.message,'error');
  }
  pushLog({area:'system', label:'Godkendelse', cust:false, friendly:(priorId?'Ny version af godkendelse: ':'Godkendelse oprettet: ')+title});
  await loadApprovals(state.eventId);
  return data.id;
}
async function sendApproval(id){
  const a=(state.approvals||[]).find(x=>x.id===id); if(!a) return;
  const {error}=await mutate(()=>sb.from('event_approvals').update({status:'afventer', requested_by:state.userId, requested_by_name:currentActor().navn, requested_at:new Date().toISOString()}).eq('id',id));
  if(error){ showToast('Kunne ikke sende: '+error.message,'error'); return; }
  pushLog({area:'system', label:'Godkendelse sendt', cust:true, friendly:'"'+a.title+'" er sendt til jeres godkendelse'});
  await loadApprovals(state.eventId); render();
  showToast('Sendt til kunden.','ok');
}
async function revokeApproval(id){
  const a=(state.approvals||[]).find(x=>x.id===id); if(!a) return;
  if(!(await appConfirm('Tilbagekald "'+a.title+'"? Kunden kan ikke længere se eller afgøre den.'))) return;
  const {error}=await mutate(()=>sb.from('event_approvals').update({status:'tilbagekaldt'}).eq('id',id));
  if(error){ showToast('Kunne ikke tilbagekalde: '+error.message,'error'); return; }
  pushLog({area:'system', label:'Godkendelse tilbagekaldt', cust:false, friendly:'"'+a.title+'" blev tilbagekaldt'});
  await loadApprovals(state.eventId); render();
}
async function decideApprovalWithComment(id, decision){
  const el=document.getElementById('decideComment-'+id);
  const comment=el?el.value.trim()||null:null;
  const a=(state.approvals||[]).find(x=>x.id===id); if(!a) return;
  const ok = await appConfirm((decision==='godkendt'?'Godkend':'Afvis')+' "'+a.title+'"'+(a.amount?' ('+kr(a.amount)+')':'')+'? Version '+a.version+'. Denne handling kan ikke fortrydes.');
  if(!ok) return;
  const {error}=await mutate(()=>sb.rpc('decide_approval',{p_id:id, p_decision:decision, p_comment:comment}));
  if(error){ showToast('Kunne ikke registrere afgørelsen: '+error.message,'error'); return; }
  pushLog({area:'system', label:'Godkendelse afgjort', cust:false, friendly:'"'+a.title+'" blev '+(decision==='godkendt'?'godkendt':'afvist')+' af '+currentActor().navn});
  await loadApprovals(state.eventId); render();
  showToast(decision==='godkendt'?'Godkendt.':'Afvist.','ok');
}

function calendarWeekStart(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay(); const diff=(day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function calendarRangeStart(){ return state.calendarRange==='dag' ? (state.calendarDate||todayIso()) : calendarWeekStart(state.calendarDate||todayIso()); }
function calendarRangeEnd(){ const s=calendarRangeStart(); return state.calendarRange==='dag' ? s : addDays(s,6); }
function todayIso(){ return nowDate().toISOString().slice(0,10); }
async function loadCalendarData(){
  if(!state.calendarDate) state.calendarDate=todayIso();
  const {data:venues}=await sb.from('venues').select('id,name,rooms(id,name,capacity_max)').eq('org_id',state.orgId).order('name');
  state.calendarVenues=venues||[];
  const isRoomView=state.calendarRange==='lokale';
  const start = isRoomView ? todayIso() : calendarRangeStart();
  const end = isRoomView ? addDays(todayIso(),60) : calendarRangeEnd();
  const {data:evs,error:evErr}=await sb.from('events').select('id,title,status,event_date').eq('org_id',state.orgId).gte('event_date',start).lte('event_date',end);
  if(evErr){ state.calendarError=true; return; }
  state.calendarError=false;
  state.calendarEventsById={}; (evs||[]).forEach(e=>{ state.calendarEventsById[e.id]=e; });
  const ids=(evs||[]).map(e=>e.id);
  if(!ids.length){ state.calendarPhases=[]; state.calendarGuestCounts={}; return; }
  const [{data:phases},{data:guests}]=await Promise.all([
    sb.from('event_rooms').select('*').in('event_id',ids),
    sb.from('guests').select('event_id,reception').in('event_id',ids)
  ]);
  state.calendarPhases=phases||[];
  const counts={}; (guests||[]).forEach(g=>{ if(g.reception) counts[g.event_id]=(counts[g.event_id]||0)+1; });
  state.calendarGuestCounts=counts;
}

      <span class="note" style="align-self:center">${datoKort(calendarRangeStart())} – ${datoKort(calendarRangeEnd())}</span>`
      : `<select id="calRoomSel" class="search" style="max-width:220px">
          ${(state.calendarVenues||[]).flatMap(v=>(v.rooms||[]).map(r=>`<option value="${r.id}" ${state.calendarRoomId===r.id?'selected':''}>${esc(v.name)} · ${esc(r.name)}</option>`)).join('')}
        </select>`}
    </div>
  </section>`;
  if(range==='lokale'){
    const roomId=state.calendarRoomId || (state.calendarVenues||[]).flatMap(v=>v.rooms||[])[0]?.id;
    const room=(state.calendarVenues||[]).flatMap(v=>v.rooms||[]).find(r=>r.id===roomId);
    const phases=(state.calendarPhases||[]).filter(p=>p.room_id===roomId).sort((a,b)=>{
      const ea=state.calendarEventsById[a.event_id], eb=state.calendarEventsById[b.event_id];
      return (ea?ea.event_date:'').localeCompare(eb?eb.event_date:'')||(a.start_time||'').localeCompare(b.start_time||'');
    });
    return `${rangeBar}<section class="card">
      <header><h2>${room?esc(room.name):'Vælg lokale'}</h2><span class="note">${room&&room.capacity_max?'Kapacitet: '+room.capacity_max:'Ingen kapacitetsgrænse angivet'} · næste 60 dage</span></header>
      ${phases.length?phases.map(calendarPhaseCard).join(''):'<div class="empty">Ingen bookinger i perioden.</div>'}
    </section>`;
  }
  const venues=state.calendarVenues||[];
  const cols=venues.flatMap(v=>(v.rooms||[]).map(r=>({venue:v,room:r})));
  return `${rangeBar}
  ${cols.length?cols.map(({venue,room})=>{
    const phases=(state.calendarPhases||[]).filter(p=>p.room_id===room.id).sort((a,b)=>{
      const ea=state.calendarEventsById[a.event_id], eb=state.calendarEventsById[b.event_id];
      return (ea?ea.event_date:'').localeCompare(eb?eb.event_date:'')||(a.start_time||'').localeCompare(b.start_time||'');
    });
    return `<section class="card">
      <header><h2>${esc(venue.name)} · ${esc(room.name)}</h2><span class="note">${room.capacity_max?'Kapacitet '+room.capacity_max:'Ingen kapacitetsgrænse'}</span></header>
      ${phases.length?phases.map(calendarPhaseCard).join(''):'<div class="empty">Ingen bookinger i denne periode.</div>'}
    </section>`;
  }).join('') : '<section class="card"><div class="empty">Ingen lokaler oprettet endnu.</div></section>'}`;
}

/* Label for et opgave-/aftalepunkts ejer ('jer'=kunden, 'kilden'=organisationen) — afhænger af hvem der ser på det, aldrig et hardkodet firmanavn. */

function logRowsFiltered(){
  let rows=state.log.filter(e=>

    (state.logWho==='alle'||e.who===state.logWho) &&
    (state.logArea==='alle'||e.area===state.logArea));
  if(state.logDays==='custom'){
    const from = state.logFrom ? new Date(state.logFrom+'T00:00:00').getTime() : null;
    const to = state.logTo ? new Date(state.logTo+'T23:59:59').getTime() : null;
    rows = rows.filter(e=>(!from||e.ts>=from)&&(!to||e.ts<=to));
  } else if(state.logDays!=='alle'){
    const cutoff = Date.now() - Number(state.logDays)*DAG;
    rows = rows.filter(e=>e.ts>=cutoff);

  const q=state.logSearch.trim().toLowerCase();
  if(q) rows = rows.filter(e=>(e.who||'').toLowerCase().includes(q)||(e.label||'').toLowerCase().includes(q)||(e.friendly||'').toLowerCase().includes(q)||(e.text||'').toLowerCase().includes(q));
  return rows;
}
/* Slår lange stræk af "kiggede ind"-hændelser fra samme person sammen til én linje, så en aktiv
   gæst/medarbejder ikke drukner de faktiske ændringer i støj. Kun konsekutive view-hændelser fra
   samme person grupperes — alt andet (ændringer, beskeder) vises altid som enkeltlinjer. */
function groupLogRows(rows){
  if(!state.logCollapseViews) return rows.map(e=>({kind:'single', e}));
  const out=[]; let i=0;
  while(i<rows.length){
    const e=rows[i];
    if(e.type==='view'){
      let j=i;
      while(j+1<rows.length && rows[j+1].type==='view' && rows[j+1].who===e.who) j++;
      const group=rows.slice(i,j+1);
      if(group.length>1) out.push({kind:'viewgroup', who:e.who, side:e.side, entries:group, key:'lv-'+e.ts});
      else out.push({kind:'single', e});
      i=j+1;
    } else { out.push({kind:'single', e}); i++; }
  }
  return out;
}
function logLine(e){
  if(e.type==='view') return '<span class="view">kiggede ind</span>';
  if(e.type==='message') return `<span class="tag">Besked</span><span class="msgq">”${esc(e.text||'')}”</span>`;
  if(e.type==='note') return `<span class="tag">Intern note</span><span class="msgq">”${esc(e.text||'')}”</span>`;
  const desc = e.friendly ? esc(e.friendly) : `${esc(e.label)}${(e.from||e.to)?` <span class="delta">${e.from?esc(e.from):'—'}<span class="arrow">→</span>${esc(e.to)}</span>`:''}`;
  return `<span class="tag">${AREA_TXT[e.area]}</span>${desc}`;
}
/* Detached <a>.click() virker ikke pålideligt i alle browsere/kontekster — elementet skal sidde i DOM'et,
   når klikket udløses. append→click→remove, plus en forsinket revokeObjectURL (ikke med det samme, da
   nogle browsere starter selve download'en asynkront, efter click() allerede er returneret). */
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

}

MODAL_BINDERS.roomPicker = function(){

  const applyToggle=(roomIds, checked)=>{
    if(itemId==='new'){
      const set=new Set(state.newCatalogItemRoomIds||[]);
      roomIds.forEach(id=> checked ? set.add(id) : set.delete(id));
      state.newCatalogItemRoomIds=[...set];
      render();
    } else if(checked) addCatalogItemRooms(itemId, roomIds);
    else removeCatalogItemRooms(itemId, roomIds);
  };
  document.querySelectorAll('.rp-room').forEach(el=>el.onchange=()=>applyToggle([el.dataset.room], el.checked));
  document.querySelectorAll('[data-rp-toggle-venue]').forEach(el=>el.onclick=()=>{

    const groupIds=(state.orgRooms||[]).filter(r=>r.venue_id===venueId).map(r=>r.id);

      };
      v.querySelectorAll('[data-picker-group]').forEach(el=>el.ontoggle=()=>{
        if(el.open) state.openPickerGroups.add(el.dataset.pickerGroup);
        else state.openPickerGroups.delete(el.dataset.pickerGroup);
      });
      const pSearch=document.getElementById('pickerSearch');
      if(pSearch){ pSearch.oninput=()=>{state.pickerSearch=pSearch.value;const p=pSearch.selectionStart;render();const n=document.getElementById('pickerSearch');if(n){n.focus();n.setSelectionRange(p,p);}}; }

      const pFilter=document.getElementById('pickerFilterStatus'); if(pFilter) pFilter.onchange=()=>{state.pickerFilterStatus=pFilter.value;render();};
      const exRetry=document.getElementById('exceptionsRetry'); if(exRetry) exRetry.onclick=()=>{

      };

      const inboxKind=document.getElementById('inboxKind'); if(inboxKind) inboxKind.onchange=()=>{ setInboxFilter({kind:inboxKind.value}); render(); };
      const inboxSortSel=document.getElementById('inboxSortSel'); if(inboxSortSel) inboxSortSel.onchange=()=>{ setInboxSort(inboxSortSel.value); render(); };

    }
    v.querySelectorAll('[data-nav]').forEach(el=>el.onclick=async()=>{

      if(state.view==='katalog') await loadOrgCatalog();

    ? '<span class="loc">'+esc(locName)+'</span>'+(rl?' · '+rl:'') : '';

  heroChips(); renderTabs();

  /* "I dag"/Køkkenseddel/Log/Admin er kilden-only faner. Uden dette tjek kan et skifte til "Forhåndsvis
     som kunde" (som ændrer state.rolle, men ikke state.tab) lade en tidligere valgt kilden-fane blive
     stående og rendere sit staff-only indhold under kundens rolle — fx "I dag"s "✓ Udført"/"Registrér
     problem"-knapper, som gæsten aldrig må se, slet ikke skrivbare, i forhåndsvisning. */
  const allowedTabs=TABS[state.rolle].map(t=>t[0]);
  if(!map[state.tab] || !allowedTabs.includes(state.tab)) state.tab='oversigt';
  document.getElementById('view').innerHTML=map[state.tab]();
  document.getElementById('view').classList.toggle('preview-locked', state.previewMode);

    ? 'Medarbejdervisning. Fuld log med opslag og ændringer.'
    : 'Kundevisning via magisk link. Tidslinjen viser kun ændringer — ikke hvem der har kigget hvornår.';
  bind();
  applyPreviewReadOnly();
}

    eks.disabled=true; eks.textContent='Forbereder fil…';

async function cloudSaveGuestsAgenda(){

async function cloudBoot(user){
  state.userEmail=user.email; state.userId=user.id;
  const {data:sa}=await sb.from('superadmins').select('name,role').eq('id',user.id).maybeSingle();
  if(sa){
    state.isSuperadmin=true; state.isAdmin=true; state.rolle='kilden'; state.isSuperadminOwner=sa.role==='ejer';
    state.actor={navn:(sa.name||'Superadmin')+' (Verta)', side:'kilden'};
    state.superadminActor=state.actor;
    state.view='superadmin';
    showApp();
    await loadSuperadminHome(); render();
    return;
  }
  const {data:st}=await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  if(st){
    state.rolle='kilden'; state.actor={navn:st.name, side:'kilden'}; state.isAdmin=(st.role==='admin'); state.orgId=st.org_id;
    const [{data:orgRow},{data:vens},{count:catCount},{data:rosterRows},{data:evs}] = await Promise.all([
      sb.from('organisations').select('name,onboarding_dismissed').eq('id',st.org_id).maybeSingle(),
      sb.from('venues').select('id,name').eq('org_id',st.org_id).order('name'),
      sb.from('catalog_items').select('id',{count:'exact',head:true}).eq('org_id',st.org_id),
      sb.from('staff').select('id,name').eq('org_id',st.org_id),
      sb.from('events').select('id,title,event_date,status,offer_total_kr,event_type,owner_staff_id,venues(name)').order('event_date',{ascending:false})
    ]);
    state.orgName=orgRow?orgRow.name:'';
    state.orgOnboardingDismissed=!!(orgRow&&orgRow.onboarding_dismissed);
    state.venues=vens||[];
    state.orgCatalogCount=catCount||0;
    state.roster=rosterRows||[];
    state.orgStaffCount=(rosterRows||[]).length;
    state.events=evs||[];
    if(state.events.length===1) openEvent(state.events[0].id); else showPicker();
    return;
  }
  /* En gæst kan legitimt have adgang til flere arrangementer (event_access.unique er på parret
     event_id+user_id, ikke på user_id alene) — "nyeste adgang vinder" var derfor aldrig en adgangs-
     lækage, men en ren routing-fejl: et NYT link genereret til arrangement B flyttede stiltiende en
     kunde, der sad inde i arrangement A, over på B ved næste genindlæsning. Løsning, i prioriteret
     rækkefølge — aldrig .order(...).limit(1)-gætteri:
     1) ?event=<id> i URL'en (sat af invite-guest's redirectTo — se den funktion) siger eksplicit,
        hvilket arrangement DETTE link/denne session hører til.
     2) Et tidligere valg i denne browser (sessionStorage) — overlever genindlæsning uden at kræve
        linket igen.
     3) Kun a præcis én adgang → ingen tvetydighed, åbn den.
     4) Ellers (flere adgange, ingen kontekst) → vis en vælger begrænset til brugerens EGNE adgange.
     Serveren/RLS afgør stadig den faktiske adgang i alle tilfælde — URL og sessionStorage er kun hints,
     aldrig en tillid i sig selv (et forfalsket ?event=<fremmed-id> matcher blot ingen række herunder). */
  const {data:acc}=await sb.from('event_access').select('id,event_id,display_name,email,first_visited_at').eq('user_id',user.id);
  if(!acc||!acc.length){ showNoAccess(); return; }

  state.guestAccesses=acc;
  if(acc.length>1){
    const {data:evs}=await sb.from('events').select('id,title,event_date,venues(name)').in('id',acc.map(a=>a.event_id));
    state.guestEvents=(evs||[]).map(ev=>({id:ev.id, title:ev.title, date:ev.event_date, venue:ev.venues?ev.venues.name:''}));
  }

  const urlEventId=new URLSearchParams(location.search).get('event');
  const storedEventId=sessionStorage.getItem('verta_active_event');
  let row = (urlEventId && acc.find(a=>a.event_id===urlEventId))
    || (storedEventId && acc.find(a=>a.event_id===storedEventId))
    || (acc.length===1 ? acc[0] : null);

  if(!row){
    state.view='guestPicker';
    showApp(); render();
    return;
  }

  state.rolle='kunde'; state.actor={navn:row.display_name, side:'kunde'};
  state.guestWelcome=!row.first_visited_at;
  sessionStorage.setItem('verta_active_event', row.event_id);
  const stamp={last_seen_at:new Date().toISOString()};
  if(!row.first_visited_at) stamp.first_visited_at=stamp.last_seen_at;
  mutate(()=>sb.from('event_access').update(stamp).eq('id',row.id).then(()=>{}));
  openEvent(row.event_id);
}
function openGuestEvent(eventId){
  state.rolle='kunde';
  const row=(state.guestAccesses||[]).find(a=>a.event_id===eventId);
  state.actor={navn:row?row.display_name:'', side:'kunde'};
  state.guestWelcome=!!(row&&!row.first_visited_at);
  sessionStorage.setItem('verta_active_event', eventId);
  if(row){
    const stamp={last_seen_at:new Date().toISOString()};
    if(!row.first_visited_at) stamp.first_visited_at=stamp.last_seen_at;
    mutate(()=>sb.from('event_access').update(stamp).eq('id',row.id).then(()=>{}));
  }
  openEvent(eventId);
}

async function openEvent(id){
  state.eventId=id;
  /* Event-specifik UI-state må aldrig lække mellem arrangementer (fx et gæstelink genereret på et andet arrangement). */
  state.guestLink=''; state.guestLinkEventId=null; state.guestLinkBusy=false;
  /* Ikke-følsomt: server/RLS afgør stadig den faktiske adgang. Kun til at gøre linket delbart/genindlæseligt. */
  try{ const u=new URL(location.href); u.searchParams.set('event', id); history.replaceState(null,'',u); }catch(e){}
  if(state.previewMode){ state.rolle=state.previewPriorRolle||'kilden'; state.previewMode=false; state.previewPriorRolle=null; }
  const [{data:ev},{data:gs},{data:ps},{data:lg}]=await Promise.all([
    sb.from('events').select('*,venues(name),organisations(name)').eq('id',id).maybeSingle(),
    sb.from('guests').select('*').eq('event_id',id).order('sort_order'),
    sb.from('agenda_items').select('*').eq('event_id',id).order('sort_order'),
    sb.from('activity_log').select('*').eq('event_id',id).order('ts',{ascending:false})
  ]);
  if(ev){ state.offerTotal=ev.offer_total_kr; state.eventDate=ev.event_date; state.eventTitle=ev.title; state.venueName=ev.venues?ev.venues.name:''; state.venueId=ev.venue_id; state.orgName=ev.organisations?ev.organisations.name:(state.orgName||''); state.ownerStaffId=ev.owner_staff_id; state.secondaryStaffId=ev.secondary_staff_id; state.dayOfOwnerStaffId=ev.day_of_owner_staff_id; state.eventType=ev.event_type; state.status=ev.status; }
  state.gaester=(gs||[]).map(gFromDb);
  state.punkter=(ps||[]).map(pFromDb);
  state.log=(lg||[]).map(logFromDb);
  state._dbG=new Set(state.gaester.map(g=>g.id));
  state.approvalRevisingId=null;
  state.docPreview=null;
  await Promise.all([loadRooms(id), loadCatalog(id), loadAgendaNotes(id), loadApprovals(id), loadChangeRequests(id)]);
  if(state.rolle==='kilden'){ await Promise.all([loadEventStaff(), loadOrgCatalog(), loadEventGuestAccesses(id)]); logCloudView(); }
  else { const {data:contact}=await sb.rpc('get_event_contact',{target_event:id}); state.contactName=contact||''; logCloudView(); }
  state.view='workspace'; state.tab = state.pendingInboxTab || 'oversigt'; state.pendingInboxTab=null;
  showApp(); render();
  subscribeRealtime(id);
}

let realtimeChannel=null;
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
}
function subscribeRealtime(id){
  unsubscribeRealtime();
  realtimeChannel = sb.channel('event-'+id)
    .on('postgres_changes', {event:'*', schema:'public', table:'activity_log', filter:'event_id=eq.'+id}, async()=>{
      const {data:lg}=await sb.from('activity_log').select('*').eq('event_id',id).order('ts',{ascending:false});
      state.log=(lg||[]).map(logFromDb); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'guests', filter:'event_id=eq.'+id}, async()=>{
      await reloadGaester(); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'agenda_items', filter:'event_id=eq.'+id}, async()=>{
      await reloadPunkter(); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'agenda_item_notes', filter:'event_id=eq.'+id}, async()=>{
      await loadAgendaNotes(id); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'event_rooms', filter:'event_id=eq.'+id}, async()=>{
      await loadRooms(id); render();
    })
    .subscribe();
}

/* Samme prisregler som antal()/prisLinjer(), men til brug på tværs af mange arrangementer på én gang
   (arrangementsoversigtens "kræver handling"-sektion) — børn tæller halvt hvis child_half, babyer altid gratis. */
function computeEventTotal(guestRows, catalogRows){
  const counts={reception:{voksne:0,boern:0}, middag:{voksne:0,boern:0}};
  (guestRows||[]).forEach(g=>{
    if(g.category==='baby') return;
    const kat = g.category==='barn' ? 'boern' : 'voksne';
    if(g.reception) counts.reception[kat]++;
    if(g.dinner) counts.middag[kat]++;
  });
  let total=0;
  (catalogRows||[]).forEach(c=>{
    if(!c) return;
    if(c.basis==='fast'){ total+=c.price_kr||0; return; }
    const b=counts[c.basis]; if(!b) return;
    total += b.voksne*(c.price_kr||0) + (c.child_half ? b.boern*(c.price_kr||0)/2 : b.boern*(c.price_kr||0));
  });
  return total;
}
/* Prioriteringsmodel for arbejdsindbakken (dokumenteret, ikke kun farve — hver reason har en "tier"
   der også vises som tekst): 1 Overskredet/kritisk, 2 Kræver medarbejderhandling, 3 Afventer kunde tæt
   på frist, 4 Kommende, 5 Information. Farve er kun et supplement (chip har altid tekst + dot). */
const INBOX_TIER_LABEL = {1:'Overskredet/kritisk', 2:'Kræver handling', 3:'Afventer kunde', 4:'Kommende', 5:'Information'};
/* Henter, på tværs af alle arrangementer i org'en, hvad der reelt kræver en næste handling: overskredne/
   nærtstående opgavefrister, godkendelser der afventer/er afvist, ubehandlede ændringsforslag, manglende
   lokale/gæstelink/ansvarlig, og prisafvigelser. Bevidst afgrænset til data, der kan hentes billigt i
   bulk (én runde forespørgsler, ikke én pr. arrangement) — kundebeskeder som selvstændig undtagelse er
   bevidst UDELADT: det kræver en server-side "sidst læst af medarbejder"-markør pr. arrangement, som ikke
   findes i skemaet i dag (ville kræve en skemaændring ud over denne opgaves omfang). */
async function loadPickerExceptions(){
  const ids=(state.events||[]).map(e=>e.id);
  state.eventExceptions={};
  if(!ids.length) return;
  const [{data:tasks},{data:rooms},{data:access},{data:guests},{data:catLinks},{data:approvals},{data:changeReqs},{data:msgs}] = await Promise.all([
    sb.from('agenda_items').select('id,event_id,title,status,due_date,assigned_staff_id,priority').in('event_id',ids),
    sb.from('event_rooms').select('event_id,room_id,start_time,end_time').in('event_id',ids),
    sb.from('event_access').select('event_id').in('event_id',ids),
    sb.from('guests').select('event_id,category,reception,dinner').in('event_id',ids),
    sb.from('event_catalog_items').select('event_id,catalog_items(price_kr,basis,child_half)').in('event_id',ids),
    sb.from('event_approvals').select('event_id,status,title,due_at').in('event_id',ids),
    sb.from('event_change_requests').select('event_id,status').in('event_id',ids),
    sb.from('activity_log').select('event_id,actor_side,ts').eq('entry_type','message').in('event_id',ids).order('ts',{ascending:false})
  ]);
  const byEvent = (rows,key) => { const m={}; (rows||[]).forEach(r=>{ (m[r.event_id]=m[r.event_id]||[]).push(key?r[key]:r); }); return m; };
  const tasksByEvent=byEvent(tasks), roomsByEvent=byEvent(rooms), accessByEvent=byEvent(access), guestsByEvent=byEvent(guests), catByEvent=byEvent(catLinks);
  const approvalsByEvent=byEvent(approvals), crByEvent=byEvent(changeReqs);
  /* "Beskeder der mangler svar" uden skemaændring: der findes ingen persisteret "sidst læst af
     medarbejder"-markør pr. arrangement (kun state.lastRead, som er lokal UI-state der nulstilles ved
     genindlæsning) — men da beskeder er en tovejs-tråd, er "hvem skrev sidst" et pålideligt signal uden
     at kræve en. Er den seneste besked i tråden fra kunden, har staff endnu ikke svaret. */
  const latestMsgByEvent={}; (msgs||[]).forEach(m=>{ if(!latestMsgByEvent[m.event_id]) latestMsgByEvent[m.event_id]=m; });
  const today=new Date().toISOString().slice(0,10);
  const in7=addDays(today,7);
  const out={}; const nextDue={};
  (state.events||[]).forEach(ev=>{
    const reasons=[];
    const openTasks=(tasksByEvent[ev.id]||[]).filter(t=>t.status!=='aftalt' && t.due_date);
    if(openTasks.length) nextDue[ev.id]=openTasks.map(t=>t.due_date).sort()[0];
    const overdue=openTasks.filter(t=>t.due_date<today);
    const soon=openTasks.filter(t=>t.due_date>=today && t.due_date<=in7);
    if(overdue.length) reasons.push({txt:overdue.length+' opgave'+(overdue.length>1?'r':'')+' er overskredet', urgent:true, tier:1, kind:'task', who:'organisationen', actionLabel:'Se opgaver', actionTab:'punkter', tasks:overdue});
    else if(soon.length) reasons.push({txt:soon.length+' opgave'+(soon.length>1?'r':'')+' har frist inden for 7 dage', urgent:false, tier:4, kind:'task', who:'organisationen', actionLabel:'Se opgaver', actionTab:'punkter', tasks:soon});
    if(!ev.owner_staff_id) reasons.push({txt:'Ingen ansvarlig medarbejder', urgent:true, tier:2, kind:'ejer', who:'organisationen', actionLabel:'Tilknyt medarbejder', actionTab:'admin'});
    const lastMsg=latestMsgByEvent[ev.id];
    if(lastMsg && lastMsg.actor_side==='kunde'){
      const hoursOld=(Date.now()-new Date(lastMsg.ts).getTime())/3600000;
      reasons.push({txt:'Kunden venter på svar', urgent:hoursOld>24, tier:2, kind:'besked', who:'organisationen', actionLabel:'Åbn beskeder', actionTab:'beskeder'});
    }
    (approvalsByEvent[ev.id]||[]).forEach(a=>{
      if(a.status==='afventer'){
        const dueSoon = a.due_at && a.due_at.slice(0,10)<=in7;
        reasons.push({txt:'Godkendelse afventer kunden: '+a.title, urgent:!!(a.due_at&&a.due_at.slice(0,10)<today), tier:dueSoon?3:4, kind:'godkendelse', who:'kunde', actionLabel:'Åbn godkendelse', actionTab:'punkter'});
      } else if(a.status==='afvist'){
        reasons.push({txt:'Godkendelse afvist: '+a.title, urgent:true, tier:2, kind:'godkendelse', who:'organisationen', actionLabel:'Åbn godkendelse', actionTab:'punkter'});
      }
    });
    const pendingCr=(crByEvent[ev.id]||[]).filter(c=>c.status==='pending');
    if(pendingCr.length) reasons.push({txt:pendingCr.length+' ændringsforslag afventer behandling', urgent:false, tier:2, kind:'aendringsforslag', who:'organisationen', actionLabel:'Se ændringsforslag', actionTab:'gaester'});
    if(ev.status==='tilbud'||ev.status==='bekræftet'){
      const rr=roomsByEvent[ev.id]||[];
      if(!rr.length || rr.some(r=>!r.room_id||!r.start_time||!r.end_time)) reasons.push({txt:'Lokale eller tidspunkt mangler', urgent:false, tier:2, kind:'lokale', who:'organisationen', actionLabel:'Vælg lokale', actionTab:'oversigt'});
      if(!(accessByEvent[ev.id]||[]).length) reasons.push({txt:'Gæstelink er ikke oprettet endnu', urgent:false, tier:4, kind:'gaestelink', who:'organisationen', actionLabel:'Del med gæsten', actionTab:'oversigt'});
    }
    if(ev.status==='kladde'){
      const d=dageTil(ev.event_date);
      if(d>=0 && d<=30) reasons.push({txt:'Arrangementet nærmer sig, men er stadig en kladde', urgent:d<=7, tier:d<=7?1:4, kind:'status', who:'organisationen', actionLabel:'Se arrangement', actionTab:'oversigt'});
    }
    const catRows=(catByEvent[ev.id]||[]).map(c=>c.catalog_items).filter(Boolean);
    if(catRows.length){
      const beregnet=computeEventTotal(guestsByEvent[ev.id], catRows);
      const diff=beregnet-(ev.offer_total_kr||0);
      if(Math.abs(diff)>=50) reasons.push({txt:'Pris er '+kr(Math.abs(diff))+(diff>0?' over':' under')+' tilbuddet', urgent:false, tier:2, kind:'pris', who:'organisationen', actionLabel:'Gennemgå pris', actionTab:'oversigt'});
    }
    const d=dageTil(ev.event_date);
    if(d>=0 && d<=3 && ev.status!=='afviklet' && reasons.some(r=>r.tier<=2)){
      reasons.unshift({txt:'Arrangementet er om '+d+' dage og er ikke klar', urgent:true, tier:1, kind:'nær-afvikling', who:'organisationen', actionLabel:'Åbn arrangement', actionTab:'live'});
    }
    if(reasons.length) out[ev.id]=reasons;
  });
  state.eventExceptions=out;
  state.eventNextDue=nextDue;
}

/* Konflikttjek for direkte tidsoverlap (inkl. opsætning/oprydning) håndhæves allerede server-side af
   check_room_conflict()-triggeren og vises via den kastede fejlbesked nedenfor. Kapacitetsoverskridelse
   er derimod ikke en hård databaseregel (et lokale kan reelt godt bruges lidt over nominel kapacitet) —
   den vises i stedet som en bekræftelse HER, før gemning, jf. kravet om at vise konflikten før gemning. */
async function checkCapacityBeforeSave(roomId){
  if(!roomId) return true;
  const room=(state.venueRooms||[]).find(r=>r.id===roomId);
  if(!room || !room.capacity_max) return true;
  const guestTotal=antal().reception.total; // konservativt: største af reception/middag ville også være rimeligt, reception er typisk størst
  if(guestTotal>room.capacity_max){
    return await appConfirm('Kapacitetsoverskridelse: '+esc(room.name)+' har plads til '+room.capacity_max+', men arrangementet har '+guestTotal+' gæster til reception. Fortsæt alligevel?');
  }
  return true;
}

const OWNERSHIP_FIELD_DB={owner:'owner_staff_id', secondary:'secondary_staff_id', dayOf:'day_of_owner_staff_id'};
const OWNERSHIP_FIELD_STATE={owner:'ownerStaffId', secondary:'secondaryStaffId', dayOf:'dayOfOwnerStaffId'};

/* Der skal altid være mindst én admin, som kan overtage et arrangement — sikret strukturelt af RLS
   (event_update tillader is_org_staff, som er sandt for enhver admin i organisationen uanset
   owner_staff_id), ikke af selve overdragelsesfunktionen. Overdragelse er derfor blot et ejerskifte;
   adgangen for andre admins er upåvirket og kræver ingen særskilt "mindst én admin tilbage"-logik her. */
async function handoverEvent(newOwnerId, moveTasks, note){
  const oldOwnerId=state.ownerStaffId;
  const oldOwnerName=(state.roster.find(r=>r.id===oldOwnerId)||{}).name||'ingen';
  const newOwnerName=(state.roster.find(r=>r.id===newOwnerId)||{}).name||'—';
  const {error}=await mutate(()=>sb.from('events').update({owner_staff_id:newOwnerId}).eq('id',state.eventId));
  if(error){ showToast('Kunne ikke overdrage: '+error.message,'error'); return false; }
  const {error:staffErr}=await mutate(()=>sb.from('event_staff').upsert({event_id:state.eventId, staff_id:newOwnerId}, {onConflict:'event_id,staff_id'}));
  if(staffErr) console.error('handover event_staff', staffErr);
  state.ownerStaffId=newOwnerId;
  if(moveTasks){
    /* Kun opgaver, der rent faktisk var tildelt den AFGIVENDE ejer, flyttes — ikke alle åbne opgaver på
       arrangementet (en tidligere fejl flyttede fx også en sekundær koordinators egne opgaver). */
    const openIds=state.punkter.filter(p=>p.status!=='aftalt' && p.assignedStaffId===oldOwnerId).map(p=>p.id);
    if(openIds.length){
      const {error:taskErr}=await mutate(()=>sb.from('agenda_items').update({assigned_staff_id:newOwnerId}).in('id',openIds));
      if(taskErr) showToast('Overdraget, men kunne ikke flytte alle åbne opgaver: '+taskErr.message,'error');
    }
  }
  pushLog({area:'system', label:'Arrangement overdraget', from:oldOwnerName, to:newOwnerName, cust:false, friendly:'Arrangementet blev overdraget fra '+oldOwnerName+' til '+newOwnerName+(note?' ("'+note+'")':'')});
  await loadEventStaff();
  if(moveTasks) await reloadPunkter();
  return true;
}

async function applyTaskTemplates(eventId, eventDate, eventType){
