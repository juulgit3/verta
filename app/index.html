<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12151B; --ink-60:rgba(18,21,27,.60); --ink-40:rgba(18,21,27,.40);
  --line:rgba(18,21,27,.14); --paper:#EAEDE6; --card:#FBFBF9;
  --blue:#1435D6; --amber:#A8681C; --moss:#3E6B4C; --radius:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Familjen Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px 96px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}

.mark{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;color:var(--blue);letter-spacing:-.01em}
.brand{display:flex;flex-direction:column;line-height:1.02;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.brand .org{font-size:12px;font-weight:600;color:var(--ink-60);letter-spacing:.02em;margin-top:1px}
.eventloc{margin-top:8px;font-size:14px;color:var(--ink-60)}
.eventloc .loc{font-weight:600;color:var(--ink)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);font-weight:600}

.rolebar{display:flex;align-items:center;gap:10px}
.consnav{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);margin-bottom:16px}
.consnav button{border:0;background:none;padding:7px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-60)}
.consnav button[aria-pressed="true"]{background:var(--ink);color:#fff}
.whoami{font-size:12px;color:var(--ink-40)}

.hero{margin:28px 0 8px}
.hero h1{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(44px,10vw,84px);line-height:.92;letter-spacing:-.02em;font-weight:400}
.hero .sub{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.chip .dot{width:7px;height:7px;border-radius:99px;background:var(--ink-40)}
.chip.warn{border-color:rgba(168,104,28,.4);color:var(--amber)} .chip.warn .dot{background:var(--amber)}
.chip.ok{border-color:rgba(62,107,76,.35);color:var(--moss)} .chip.ok .dot{background:var(--moss)}
.chip.blue{border-color:rgba(20,53,214,.3);color:var(--blue)} .chip.blue .dot{background:var(--blue)}

.statussteps{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.sstep{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-40);background:var(--card)}
.sstep.done{border-color:rgba(62,107,76,.4);color:var(--moss);background:rgba(62,107,76,.08)}
.sstep.current{border-color:var(--blue);color:#fff;background:var(--blue)}
.sstep.interactive{cursor:pointer}
.sstep.interactive:hover{border-color:var(--ink)}
.sstep.current.interactive:hover{filter:brightness(1.1)}

.card > summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;cursor:pointer}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
.fold-chev{display:inline-block;font-size:10px;color:var(--ink-40);transition:transform .15s ease;margin-right:6px}
details[open] > summary .fold-chev,details[open] .fold-chev{transform:rotate(90deg)}

nav.tabs{display:flex;gap:2px;margin:26px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-60);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
nav.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card .note{font-size:13px;color:var(--ink-60)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

.num{font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
.big{font-family:'Instrument Serif',serif;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

.recon{margin-top:14px;border-left:3px solid var(--blue);background:rgba(20,53,214,.05);padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0}
.recon.off{border-left-color:var(--amber);background:rgba(168,104,28,.07)}
.recon .t{font-weight:700;font-size:14px}
.recon .d{font-size:13px;color:var(--ink-60);margin-top:2px}

.item{display:grid;grid-template-columns:3px 1fr auto;gap:14px;align-items:start;border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.stripe{align-self:stretch;border-radius:99px;background:var(--ink-40)}
.stripe.jer{background:var(--blue)} .stripe.kilden{background:var(--ink)}
.item .name{font-weight:600;font-size:15px}
.item .meta{font-size:12.5px;color:var(--ink-60);margin-top:2px}
.item .meta .due{color:var(--amber);font-weight:600}
.item .meta .due.past{text-decoration:underline}
select.status{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:5px 8px;font-size:13px}
select.status:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input[type=text]{width:100%;border:0;background:transparent;padding:3px 0}
.tbl input[type=text]:focus{outline:0;border-bottom:1px solid var(--blue)}
.tbl select{border:0;background:transparent;padding:2px}
.tbl td.c{text-align:center;width:70px}
.tbl .del{border:0;background:none;color:var(--ink-40);cursor:pointer;font-size:16px;line-height:1}
.tbl .del:hover{color:var(--amber)}
.scroll{overflow-x:auto}

.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .1s ease,filter .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.55;cursor:default;pointer-events:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:14px;background:#fff;min-width:180px}
.empty{color:var(--ink-60);font-size:14px;padding:14px 0}

/* --- staff log --- */
.logfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.logfilters select{border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:13px;background:#fff}
.logrow{display:grid;grid-template-columns:120px 128px 1fr;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.logrow:last-child{border-bottom:0}
.logrow .when{font-variant-numeric:tabular-nums;color:var(--ink-60);font-size:12.5px}
.logrow .who{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px}
.logrow .who .dot{width:7px;height:7px;border-radius:99px}
.logrow .who .dot.kilden{background:var(--ink)} .logrow .who .dot.kunde{background:var(--blue)}
.logrow .what .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-40);font-weight:600;margin-right:8px}
.logrow .what .view{color:var(--ink-40)}
.logrow .delta{font-variant-numeric:tabular-nums}
.logrow .delta .arrow{color:var(--ink-40);margin:0 5px}
.logrow.viewrow{opacity:.72}

/* --- customer timeline --- */
.tl{position:relative;margin-top:6px;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tlday{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40);font-weight:600;margin:18px 0 8px}
.tlday:first-child{margin-top:0}
.tlitem{position:relative;padding:6px 0 10px}
.tlitem:before{content:"";position:absolute;left:-21px;top:11px;width:9px;height:9px;border-radius:99px;background:var(--card);border:2px solid var(--blue)}
.tlitem.kilden:before{border-color:var(--ink)}
.tlitem .txt{font-size:15px}
.tlitem .by{font-size:12.5px;color:var(--ink-60);margin-top:1px}

/* --- beskeder (tråd, ikke chat) --- */
.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.compose{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:12px;margin-bottom:8px}
.compose textarea{width:100%;border:0;resize:vertical;min-height:60px;font:inherit;outline:0;line-height:1.45}
.compose .crow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.compose .hint{font-size:12px;color:var(--ink-40);max-width:60%}
.msg{border-left:3px solid var(--ink);border-radius:0 var(--radius) var(--radius) 0;background:#fff;padding:11px 14px;margin:10px 0}
.msg.kunde{border-left-color:var(--blue)}
.msg .mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.msg .mwho{font-weight:600;font-size:13.5px}
.msg .mtime{font-size:12px;color:var(--ink-40);font-variant-numeric:tabular-nums;white-space:nowrap}
.msg .mtext{font-size:14.5px;white-space:pre-wrap;line-height:1.5}
.logrow .msgq{font-style:italic}

footer.legal{margin-top:28px;font-size:12px;color:var(--ink-40);line-height:1.6}

#superadminBar{background:var(--ink);border-bottom:3px solid var(--amber)}
.sabar-inner{max-width:960px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sabar-label{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber)}
.sabar-label #sabarOrg{color:rgba(234,237,230,.65);font-weight:600;text-transform:none;letter-spacing:0}
.sabar-label #sabarActorNote{color:var(--amber);font-weight:700;text-transform:none;letter-spacing:0}
.sabar-btn{background:rgba(234,237,230,.08);border-color:rgba(234,237,230,.25);color:rgba(234,237,230,.85)}
#sabarActorSelect option{background:var(--ink);color:#fff}
.sabar-btn:hover{border-color:var(--amber);color:#fff}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;border:0;border-radius:99px;background:var(--blue);color:#fff;
  font-weight:700;font-size:14px;padding:13px 20px;box-shadow:0 4px 14px rgba(18,21,27,.25);cursor:pointer;
  transition:transform .1s ease,filter .15s ease}
.fab:hover{filter:brightness(1.1)}
.fab:active{transform:scale(.96)}

/* toast + bekræft-modal (erstatter alert/confirm) */
#toastWrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 16px;width:100%;max-width:420px}
.toast{background:var(--ink);color:#fff;border-radius:var(--radius);padding:12px 16px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 20px rgba(18,21,27,.3);animation:toastin .2s ease both;max-width:100%}
.toast.error{background:#5C1A1A}
.toast.ok{background:var(--moss)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#confirmModal{display:none;position:fixed;inset:0;background:rgba(18,21,27,.45);z-index:65;align-items:center;justify-content:center;padding:20px}
#confirmModal .box{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
#confirmModal p{font-size:14.5px;line-height:1.5;margin:0 0 18px}

/* felt-labels */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;color:var(--ink-40);letter-spacing:.03em;text-transform:uppercase}
.field select,.field input{width:100%}

/* formular med flere felter, pænt justeret i grid i stedet for flex (undgår hulter-til-bulter ombrydning) */
.formgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:12px 14px;align-items:end}
.formgrid .full{grid-column:1/-1}
.formgrid .btn{grid-column:1/-1;justify-self:end}
input[type=file].search{padding:6px 8px;font-size:13px;min-width:0}

/* gemt-feedback på inline-redigering */
.flash-saved{background:rgba(62,107,76,.16)!important;transition:background .7s ease}

/* opgave-noter og filer */
.tasknote{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tnhead{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12.5px}
.tnfile{font-size:12.5px;padding:4px 10px}
.notes-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;cursor:pointer}
.notes-toggle:hover{border-color:var(--blue);color:var(--blue)}
.notes-toggle .fold-chev{margin-right:0;color:inherit}
.notes-badge{background:var(--blue);color:#fff;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
.notes-wrap{grid-column:1/-1;margin-top:10px;padding-top:10px;border-top:1px dotted var(--line)}

/* loading-skærm */
#bootLoading{position:fixed;inset:0;background:var(--paper);z-index:90;display:flex;align-items:center;justify-content:center}

@media print{body{background:#fff} nav.tabs,.btn,.row.noprint,.rolebar,#superadminBar,.fab,#toastWrap,#bootLoading{display:none!important} .card{border:0;padding:0;margin-bottom:22px}}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .32s ease both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

@media(max-width:600px){
  .wrap{padding:18px 14px 90px}
  .logrow{grid-template-columns:1fr;gap:2px}
  .fab{right:14px;padding:12px 16px;font-size:13px}
  .card{padding:14px 14px 16px}
  .item{grid-template-columns:3px 1fr;row-gap:8px}
  .item > .row{grid-column:1/-1;justify-content:flex-start}
  .search{min-width:0;flex:1 1 140px}
  .hero .sub{gap:8px}
  .consnav{flex-wrap:wrap;border-radius:var(--radius)}
  .formgrid{grid-template-columns:1fr}
  .formgrid .field{grid-column:1/-1!important}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="bootLoading"><span class="mark">Verta</span></div>
<div id="toastWrap"></div>
<div id="confirmModal">
  <div class="box">
    <p id="confirmMsg"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="confirmCancel">Annullér</button>
      <button class="btn primary" id="confirmOk">Bekræft</button>
    </div>
  </div>
</div>
<div id="superadminBar" style="display:none">
  <div class="sabar-inner">
    <span class="sabar-label">⚡ Superadmin<span id="sabarOrg"></span><span id="sabarActorNote"></span></span>
    <span class="row" style="gap:8px">
      <select class="btn sabar-btn" id="sabarActorSelect" style="display:none"></select>
      <button class="btn sabar-btn" id="sabarGuestToggle" style="display:none">Vis som gæst</button>
      <button class="btn sabar-btn" id="sabarHome">Kontrolrum</button>
    </span>
  </div>
</div>
<div class="wrap">

  <div class="topline">
    <button class="brand" id="brandHome" type="button" title="Til din forside">
      <span class="mark">Verta</span>
      <span class="org" id="orgName"></span>
    </button>
    <div class="rolebar">
      <span class="whoami" id="whoami"></span>
      <button class="btn" id="backToList" style="display:none">‹ Arrangementer</button>
      <button class="btn" id="setPasswordBtn" style="display:none">Kodeord</button>
      <button class="btn" id="logout" style="display:none">Log ud</button>
    </div>
  </div>

  <div class="hero">
    <h1 id="heroTitle">Verta</h1>
    <div class="eventloc" id="eventLoc"></div>
    <div class="sub" id="heroChips"></div>
  </div>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <main id="view"></main>

  <div id="gate" style="display:none;visibility:visible;position:fixed;inset:0;background:var(--paper);z-index:50;align-items:center;justify-content:center;padding:20px">
    <div style="max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px">
      <div class="mark" style="margin-bottom:6px">Verta</div>
      <h2 style="font-family:'Instrument Serif',serif;font-style:italic;font-size:30px;font-weight:400;margin:0 0 4px">Log ind</h2>
      <p id="gateMsg" class="note" style="color:var(--ink-60);font-size:14px;margin:0 0 16px">Skriv din mail — du får et link, du logger ind med. Ingen adgangskode.</p>
      <input id="gateEmail" class="search" style="width:100%;margin-bottom:10px" type="email" placeholder="dig@eksempel.dk" autocomplete="email">
      <input id="gatePassword" type="password" class="search" style="width:100%;margin-bottom:10px;display:none" placeholder="Kodeord" autocomplete="current-password">
      <button class="btn primary" id="gateSend" style="width:100%">Send login-link</button>
      <button class="btn primary" id="gatePasswordLogin" style="width:100%;display:none">Log ind</button>
      <button class="btn" type="button" id="gateToggleMode" style="width:100%;margin-top:8px">Har du et kodeord? Log ind med det i stedet</button>
    </div>
  </div>
  <div id="passwordModal" style="display:none;position:fixed;inset:0;background:rgba(18,21,27,.45);z-index:60;align-items:center;justify-content:center;padding:20px">
    <div style="max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px">
      <h2 style="font-family:'Instrument Serif',serif;font-style:italic;font-size:24px;font-weight:400;margin:0 0 14px">Sæt kodeord</h2>
      <p class="note" style="margin:0 0 14px;font-size:13.5px;line-height:1.5">Så kan du logge ind med kodeord i stedet for at vente på en mail, næste gang.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="field"><label for="pwNew">Nyt kodeord</label><input id="pwNew" type="password" class="search" placeholder="Mindst 8 tegn" style="width:100%" autocomplete="new-password"></div>
        <div class="field"><label for="pwConfirm">Bekræft kodeord</label><input id="pwConfirm" type="password" class="search" style="width:100%" autocomplete="new-password"></div>
      </div>
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button class="btn" id="pwCancel">Annullér</button>
        <button class="btn primary" id="pwSave">Gem</button>
      </div>
    </div>
  </div>

  <footer class="legal" id="legal"></footer>
</div>

<button id="fabAddTask" class="fab" style="display:none">+ Opgave</button>
<div id="taskModal" style="display:none;position:fixed;inset:0;background:rgba(18,21,27,.45);z-index:60;align-items:center;justify-content:center;padding:20px">
  <div style="max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px">
    <h2 style="font-family:'Instrument Serif',serif;font-style:italic;font-size:24px;font-weight:400;margin:0 0 14px">Opret opgave</h2>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label for="tmTitel">Titel</label><input id="tmTitel" class="search" placeholder="Fx Bordplan" style="width:100%"></div>
      <div class="field"><label for="tmEjer">Ansvarlig</label><select id="tmEjer" class="search" style="width:100%">
        <option value="jer">Kunden</option>
        <option value="kilden">Mig</option>
      </select></div>

<script>
/* =========================================================
   1. DATA
   ========================================================= */
const DAG = 86400000;

/* =========================================================
   2. KONFIGURATION
   Project URL + anon-nøgle. anon er ikke hemmelig — må gerne committes.
   ========================================================= */
const SUPA = { url:'https://bksaazivbzgxzmgzhbqu.supabase.co', anon:'sb_publishable_y81wiQGZXEzwxO56U7BSFg_A2fwkaXg' };   // ← Supabase → Project Settings → API
const sb = window.supabase.createClient(SUPA.url, SUPA.anon);

let state = { gaester:[], punkter:[], log:[],
              tab:'oversigt', soeg:'', rolle:'kilden', logType:'alle', logWho:'alle', logArea:'alle',
              lastRead:{kilden:0, kunde:0}, phases:[], venueRooms:[], staffList:[], invitesList:[], venuesFull:[],
              eventCatalog:[], orgCatalog:[], openRoomPickers:new Set(),
              openPickerGroups:new Set(['kladde','tilbud','bekræftet']),
              isSuperadmin:false, allOrgs:[], guestLink:'', guestLinkBusy:false,
              guestWelcome:false, contactName:'', orgOnboardingDismissed:false, orgCatalogCount:0, orgStaffCount:0,
              taskTemplates:[], agendaNotes:{}, openTaskNotes:new Set(), openDoneGroups:new Set(),
              superadminActor:null, impersonating:null, roster:[] };
function save(){ cloudSaveGuestsAgenda(); }
const currentActor = () => state.actor||{navn:'?',side:'kilden'};

/* =========================================================
   UI-hjælpere: toast + bekræft-modal (erstatter alert/confirm), Enter-taste
   ========================================================= */
function showToast(msg, kind){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:'');
  t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function appConfirm(msg){
  return new Promise(resolve=>{
    document.getElementById('confirmMsg').textContent=msg;
    const modal=document.getElementById('confirmModal');
    modal.style.display='flex';
    const ok=document.getElementById('confirmOk'), cancel=document.getElementById('confirmCancel');
    const cleanup=result=>{ modal.style.display='none'; ok.onclick=null; cancel.onclick=null; resolve(result); };
    ok.onclick=()=>cleanup(true);
    cancel.onclick=()=>cleanup(false);
  });
}
function onEnterSubmit(el, fn){
  if(!el) return;
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); fn(); } });
}
function onEnterBlur(el){
  if(!el) return;
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
}
function flashSaved(selector){
  const el=document.querySelector(selector);
  if(!el) return;
  el.classList.add('flash-saved');
  setTimeout(()=>el.classList.remove('flash-saved'),900);
}

/* =========================================================
   3. LOG
   ========================================================= */
function pushLog({area,label,from='',to='',cust=false,friendly=''}){
  const a=currentActor();
  const ev={id:'e'+Date.now()+Math.random().toString(36).slice(2,5), ts:Date.now(),
    side:a.side, who:a.navn, type:'change', area, label, from:String(from), to:String(to), cust, friendly, text:''};
  state.log.unshift(ev);
  sb.from('activity_log').insert(logToDb(ev)).then(({error})=>error&&console.error('log',error));
}
function pushMessage(text){
  const a=currentActor();
  const ev={id:'m'+Date.now(), ts:Date.now(), side:a.side, who:a.navn,
    type:'message', area:'system', text:text.trim(), from:'', to:'', cust:false, friendly:''};
  state.log.unshift(ev);
  state.lastRead[a.side]=Date.now();
  sb.from('activity_log').insert(logToDb(ev)).then(({error})=>error&&console.error('msg',error));
  /* v2: her udløser en Edge Function en mail til den anden part, jf. roadmap */
}
const unread = rolle => { const last=state.lastRead[rolle]||0;
  return state.log.filter(e=>e.type==='message'&&e.side!==rolle&&e.ts>last).length; };

/* =========================================================
   4. BEREGNINGER
   ========================================================= */
const kr = n => n.toLocaleString('da-DK')+' kr.';
function dageTil(iso){ return Math.ceil((new Date(iso+'T00:00:00')-new Date())/DAG); }
function datoKort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'}); }

function antal(){
  const g=state.gaester, t=k=>({
    voksne:g.filter(x=>x[k]&&x.kat==='voksen').length,
    boern: g.filter(x=>x[k]&&x.kat==='barn').length,
    babyer:g.filter(x=>x[k]&&x.kat==='baby').length });
  const r=t('reception'), m=t('middag');
  r.total=r.voksne+r.boern+r.babyer; m.total=m.voksne+m.boern+m.babyer;
  return {reception:r, middag:m};
}
function prisLinjer(){
  const a=antal();
  return (state.eventCatalog||[]).map(p=>{
    if(p.grundlag==='fast') return {...p,stk:1,belob:p.sats,grundlagTxt:'fast beløb'};
    const b=a[p.grundlag];
    const v=b.voksne*p.sats, bo=p.boernHalv?b.boern*(p.sats/2):b.boern*p.sats;
    return {...p,stk:b.voksne+b.boern,belob:v+bo,
      grundlagTxt:b.voksne+' voksne'+(b.boern?' + '+b.boern+' børn til halv pris':'')+' · babyer gratis'};
  });
}
const total = () => prisLinjer().reduce((s,l)=>s+l.belob,0);
const aabnePunkter = () => state.punkter.filter(p=>p.status!=='aftalt');

/* mutation-wrapper: logger + fanger antalsændring */
function guestMutation(apply, staffLabel){
  const b=antal(); apply(); const a=antal();
  pushLog({area:'gaester', label:staffLabel});
  if(a.middag.total!==b.middag.total)
    pushLog({area:'gaester',label:'Deltagerantal (middag)',from:b.middag.total,to:a.middag.total,cust:true,friendly:'Deltagerantal til middag opdateret til '+a.middag.total});
  else if(a.reception.total!==b.reception.total)
    pushLog({area:'gaester',label:'Deltagerantal (reception)',from:b.reception.total,to:a.reception.total,cust:true,friendly:'Deltagerantal til reception opdateret til '+a.reception.total});
  save(); render();
}

/* =========================================================
   5. VISNING
   ========================================================= */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TABS = {
  kilden:[['oversigt','Oversigt'],['gaester','Gæster'],['punkter','Aftalepunkter'],['koekken','Køkkenseddel'],['log','Log'],['admin','Admin'],['beskeder','Beskeder']],
  kunde: [['oversigt','Oversigt'],['gaester','Gæster'],['punkter','Aftalepunkter'],['tidslinje','Tidslinje'],['beskeder','Beskeder']]
};

function renderTabs(){
  const el=document.getElementById('tabs'), n=unread(state.rolle);
  el.innerHTML = TABS[state.rolle].map(([id,label])=>
    `<button role="tab" data-tab="${id}" aria-selected="${state.tab===id}">${label}${id==='beskeder'&&n?`<span class="tabbadge">${n}</span>`:''}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.soeg='';render();});
}

function roomsLine(){
  const byRoom={};
  (state.phases||[]).forEach(p=>{ if(p.roomName){ (byRoom[p.roomName]=byRoom[p.roomName]||[]).push(p.label); } });
  return Object.entries(byRoom).map(([rm,phs])=>esc(rm)+' ('+phs.join(' & ')+')').join(' · ');
}

function heroChips(){
  const d=dageTil(state.eventDate), aabne=aabnePunkter();
  const jer=aabne.filter(p=>p.ejer==='jer').length, kilden=aabne.filter(p=>p.ejer==='kilden').length;
  const datoTxt = new Date(state.eventDate+'T00:00:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('heroChips').innerHTML=`
    <span class="chip blue"><span class="dot"></span>${datoTxt}</span>
    <span class="chip"><span class="dot"></span><b class="num">${d}</b>&nbsp;dage til</span>

    ${kilden&&state.rolle==='kilden'?`<span class="chip warn"><span class="dot"></span>${kilden} afventer os</span>`:''}
    ${state.rolle==='kunde'&&state.contactName?`<span class="chip"><span class="dot"></span>Kontakt: ${esc(state.contactName)}</span>`:''}`;
}

      <div class="field" style="flex:1;min-width:120px"><label for="edPrice">Tilbudsbeløb, kr</label><input id="edPrice" type="number" class="search" placeholder="Tilbud, kr" value="${state.offerTotal||0}" style="width:100%"></div>
      <div class="field" style="flex:1;min-width:130px"><label for="edType">Arrangementstype</label><select id="edType" class="search" style="width:100%">

/* Delt kort til "kom godt i gang"-agtige tjeklister (org-opsætning, arrangement-opsætning) */
function checklistHtml(title, note, items, footer){
  return `<section class="card">
    <header><h2>${title}</h2><span class="note">${note}</span></header>
    ${items.map(i=>`<div class="stat"><span>${i.done?'✓ ':''}${i.label}${i.optional&&!i.done?' <span class="note">(valgfrit)</span>':''}</span>${i.action||''}</div>`).join('')}
    ${footer||''}
  </section>`;
}
function viewOversigt(){
  const a=antal(), linjer=prisLinjer(), t=total(), diff=t-state.offerTotal;
  const aabne=aabnePunkter().sort((x,y)=>(x.frist||'9999').localeCompare(y.frist||'9999'));
  const welcomeKort = (state.rolle==='kunde' && state.guestWelcome) ? `
  <section class="card" style="border-left:3px solid var(--blue)">

    <p style="margin:0 0 10px;font-size:14.5px;line-height:1.6">I er tilmeldt jeres ${esc(state.eventType||'arrangement')} hos ${esc(state.venueName||'')} d. ${datoKort(state.eventDate)}${state.contactName?' — jeres kontakt hos '+esc(state.orgName||'')+' er '+esc(state.contactName):''}.</p>

    <button class="btn primary" id="welcomeDismiss">Se jeres arrangement</button>

  const setupKort = (state.rolle==='kilden' && state.status==='kladde') ? (()=>{

    return checklistHtml('Sæt arrangementet op', `${[hasRoom,hasPrice,hasCatalog].filter(Boolean).length}/3`, [

      {done:hasCatalog, label:'Tilføj katalogvarer', action:hasCatalog?'':'<button class="btn" data-goto-tab="admin">Gå til →</button>'}
    ], '<div class="note" style="margin-top:8px">Guiden forsvinder, når I skifter status fra Kladde til Tilbud.</div>');
  })() : '';
  const statusKort = (state.rolle==='kilden') ? `

  const deleKort = (state.rolle==='kilden') ? `

    <div class="stat" style="flex-wrap:wrap;gap:8px">
      <span class="note" style="word-break:break-all;flex:1 1 260px">${esc(state.guestLink)}</span>
      <button class="btn" id="guestLinkCopy">Kopiér</button>
      <button class="btn" id="guestLinkNew">Nyt link</button>
    </div>
    <div class="note" style="display:block;margin-top:6px;font-size:12px">Linket logger gæsten direkte ind på dette arrangement. Del det kun med kunden.</div>
    ` : `
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <input class="search" id="guestLinkName" placeholder="Navn (fx Emily &amp; Lars)" style="flex:1 1 160px">
      <input class="search" id="guestLinkEmail" placeholder="Mail" type="email" style="flex:1 1 160px">
      <button class="btn primary" id="guestLinkGen" ${state.guestLinkBusy?'disabled':''}>${state.guestLinkBusy?'Genererer…':'Generér link'}</button>
    </div>
    `}
  </section>` : '';
  const lokaleKort = (state.rolle==='kilden') ? `
  <section class="card">
    <header><h2>Lokaler pr. fase</h2><span class="note">${esc(state.venueName||'')}</span></header>
    ${(state.phases||[]).length?(state.phases||[]).map(p=>`<div class="stat" style="flex-wrap:wrap;gap:6px">

        </select>
        <input type="time" class="search" style="width:88px" data-phase-field="start" data-phase="${p.id}" value="${p.start||''}">
        <span class="note">–</span>
        <input type="time" class="search" style="width:88px" data-phase-field="end" data-phase="${p.id}" value="${p.end||''}">

      </span>
    </div>`).join(''):'<div class="empty">Ingen faser oprettet endnu — arrangementet har ikke nødvendigvis brug for alle tre klassiske faser.</div>'}
    <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">

      <select class="search" id="newPhaseRoom">
        <option value="">— lokale —</option>
        ${(state.venueRooms||[]).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}

      <input type="time" class="search" id="newPhaseEnd" style="width:88px">
      <button class="btn primary" id="addPhaseBtn">Tilføj fase</button>

  </section>` : '';
  const udestaaendeKort = `
  <section class="card">
    <header><h2>Udestående</h2><span class="note">sorteret efter frist</span></header>
    ${aabne.length?aabne.map(p=>{const d=p.frist?dageTil(p.frist):null;return `<div class="item">
      <span class="stripe ${p.ejer}"></span>

    </section>
    <section class="card">
      <header><h2>Pris</h2><span class="note">inkl. moms</span></header>
      ${linjer.map(l=>`<div class="stat"><span>${l.navn}<br><span class="note">${l.grundlagTxt}</span></span><b class="num">${kr(l.belob)}</b></div>`).join('')}
      <div class="stat" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px"><span style="font-weight:700">I alt</span><b class="big">${kr(t)}</b></div>

      </div>
    </section>
  </div>`;
  if(state.rolle==='kunde'){
    return `${welcomeKort}${udestaaendeKort}${gaesterPrisKort}`;

function taskNotesHtml(p){

  const isOpen = state.openTaskNotes.has(p.id);
  return `<div class="notes-wrap">
  <details data-task-notes="${p.id}" ${isOpen?'open':''}>
    <summary class="notes-toggle"><span class="fold-chev">▸</span>📎 Noter og filer${notes.length?`<span class="notes-badge">${notes.length}</span>`:''}</summary>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
      ${notes.length?notes.map(n=>`<div class="tasknote">
        <div class="tnhead"><span class="dot ${n.author_side}"></span><b>${esc(n.author_name)}</b><span class="note">${tid(n.created_at)}</span></div>
        ${n.text?`<div>${esc(n.text)}</div>`:''}

function renderTask(p){
  const kilden = state.rolle==='kilden';
  const d = p.frist ? dageTil(p.frist) : null;
  const erUdfoert = p.status==='aftalt';
  let controls;
  if(kilden){
    controls = `<select class="status" data-status>${['mangler','udkast','aftalt'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select>`;
  } else if(p.ejer==='jer'){
    controls = erUdfoert
      ? `<button class="btn" data-punkt-undo="${p.id}">Fortryd</button>`
      : `<button class="btn primary" data-punkt-done="${p.id}">Marker som udført</button>`;
  } else {
    controls = `<span class="chip ${p.status==='mangler'?'warn':''}"><span class="dot"></span>${STATUS_LABEL[p.status]||p.status}</span>`;
  }
  return `<div class="item" data-pid="${p.id}">
    <span class="stripe ${p.ejer}"></span>
    <div><div class="name">${esc(p.titel)}</div><div class="meta">${p.frist?`Frist ${datoKort(p.frist)} · <span class="due ${d<0?'past':''}">${d<0?Math.abs(d)+' dage over':'om '+d+' dage'}</span>`:'Ingen frist'}${p.note?' · '+esc(p.note):''}</div></div>
    <span class="row" style="gap:6px">
    ${controls}
    ${kilden?`<button class="btn" data-punkt-delete="${p.id}">Slet</button>`:''}
    </span>
    ${taskNotesHtml(p)}
  </div>`;
}
function viewPunkter(){

      <button class="btn primary" id="pkOpret">Opret</button>
    </div>
  </section>` : '';
  const kildenTitel = kilden ? 'Vores ansvar' : `Ansvar hos ${state.orgName||'os'}`;

function tid(ts){ return new Date(ts).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
const AREA_TXT = {gaester:'Gæster',punkter:'Punkter',pris:'Pris',system:'System'};
const STATUS_LABEL = {mangler:'Mangler', udkast:'Udkast', aftalt:'Udført'};
/* Label for et opgave-/aftalepunkts ejer ('jer'=kunden, 'kilden'=organisationen) — afhænger af hvem der ser på det, aldrig et hardkodet firmanavn. */
function ejerLabel(ejer){
  if(ejer==='jer') return state.rolle==='kilden' ? 'Kunden' : 'Jer';
  return state.rolle==='kilden' ? 'Os' : (state.orgName||'Os');
}

function viewLog(){
  const whoList=[...new Set(state.log.map(e=>e.who))];
  let rows=state.log.filter(e=>
    (state.logType==='alle'||(state.logType==='aendringer'&&e.type==='change')||(state.logType==='opslag'&&e.type==='view')||(state.logType==='beskeder'&&e.type==='message')) &&
    (state.logWho==='alle'||e.who===state.logWho) &&
    (state.logArea==='alle'||e.area===state.logArea));
  return `
  <section class="card">
    <header><h2>Aktivitetslog</h2><span class="note">${rows.length} af ${state.log.length} hændelser</span></header>
    <div class="logfilters noprint">
      <select id="fType"><option value="alle">Alle typer</option><option value="aendringer" ${state.logType==='aendringer'?'selected':''}>Kun ændringer</option><option value="opslag" ${state.logType==='opslag'?'selected':''}>Kun opslag</option><option value="beskeder" ${state.logType==='beskeder'?'selected':''}>Kun beskeder</option></select>
      <select id="fWho"><option value="alle">Alle personer</option>${whoList.map(w=>`<option value="${esc(w)}" ${state.logWho===w?'selected':''}>${esc(w)}</option>`).join('')}</select>
      <select id="fArea"><option value="alle">Alle områder</option>${Object.entries(AREA_TXT).map(([k,v])=>`<option value="${k}" ${state.logArea===k?'selected':''}>${v}</option>`).join('')}</select>
    </div>
    ${rows.length?rows.map(e=>`<div class="logrow ${e.type==='view'?'viewrow':''}">
      <span class="when">${tid(e.ts)}</span>
      <span class="who"><span class="dot ${e.side}"></span>${esc(e.who.split(' (')[0])}</span>
      <span class="what">${
        e.type==='view' ? '<span class="view">kiggede ind</span>' :
        e.type==='message' ? `<span class="tag">Besked</span><span class="msgq">”${esc(e.text||'')}”</span>` :
        `<span class="tag">${AREA_TXT[e.area]}</span>${esc(e.label)}${(e.from||e.to)?` <span class="delta">${e.from?esc(e.from):'—'}<span class="arrow">→</span>${esc(e.to)}</span>`:''}`}${e.ip?` <span class="note" style="font-variant-numeric:tabular-nums">· ${esc(e.ip)}</span>`:''}</span>
    </div>`).join(''):'<div class="empty">Ingen hændelser matcher filteret.</div>'}
  </section>`;
}

function viewTidslinje(){
  const evs=state.log.filter(e=>e.type==='change'&&e.cust).sort((a,b)=>b.ts-a.ts);

  evs.forEach(e=>{const d=new Date(e.ts).toLocaleDateString('da-DK',{day:'numeric',month:'long',year:'numeric'});(grupper[d]=grupper[d]||[]).push(e);});
  return `
  <section class="card">
    <header><h2>Ændringer i jeres aftale</h2><span class="note">nyeste øverst</span></header>
    ${evs.length?`<div class="tl">${Object.entries(grupper).map(([dag,liste])=>`
      <div class="tlday">${dag}</div>
      ${liste.map(e=>`<div class="tlitem ${e.side}">
        <div class="txt">${esc(e.friendly)}</div>
        <div class="by">${e.side==='kunde'?'af jer':'af '+esc(state.orgName||'os')} · ${new Date(e.ts).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}</div>

   6. RENDER + HÆNDELSER

function render(){
  document.getElementById('bootLoading').style.display = 'none';
  renderSuperadminBar();
  document.getElementById('logout').style.display = '';
  document.getElementById('setPasswordBtn').style.display = '';
  document.getElementById('backToList').style.display = (state.rolle==='kilden' && (state.events||[]).length>1 && state.view==='workspace') ? '' : 'none';
  document.getElementById('fabAddTask').style.display = (state.rolle==='kilden' && state.view==='workspace') ? 'block' : 'none';

  if(state.view==='picker' || state.view==='users' || state.view==='venues' || state.view==='katalog' || state.view==='opgaver' || state.view==='superadmin'){
    document.title = 'Verta';
    document.getElementById('whoami').textContent = state.actor?('Logget ind som '+state.actor.navn):'';
    document.getElementById('orgName').textContent = state.view==='superadmin' ? '' : (state.orgName||'');
    document.getElementById('eventLoc').innerHTML='';
    document.getElementById('heroTitle').textContent = state.view==='superadmin' ? 'Kontrolrum' : (state.view==='users' ? 'Brugere' : (state.view==='venues' ? 'Lokationer' : (state.view==='katalog' ? 'Katalog' : (state.view==='opgaver' ? 'Opgaver' : 'Arrangementer'))));
    document.getElementById('heroChips').innerHTML='';
    document.getElementById('tabs').innerHTML='';
    const v=document.getElementById('view');
    if(state.view==='superadmin'){
      v.innerHTML=viewSuperadminHome();
      v.querySelectorAll('[data-enter-org]').forEach(el=>el.onclick=()=>enterOrgAsSuperadmin(el.dataset.enterOrg));
      const dc=document.getElementById('doCreate'); if(dc){ dc.onclick=createDemoOrg; onEnterSubmit(document.getElementById('doName'), ()=>dc.click()); }
      const ncc=document.getElementById('ncCreate'); if(ncc){ ncc.onclick=createRealCustomer;
        onEnterSubmit(document.getElementById('ncOrgName'), ()=>ncc.click());
        onEnterSubmit(document.getElementById('ncAdminName'), ()=>ncc.click());
        onEnterSubmit(document.getElementById('ncAdminEmail'), ()=>ncc.click());
      }
    } else if(state.view==='users'){
      v.innerHTML=viewBrugere();
      const is=document.getElementById('invSend'); if(is){ is.onclick=inviteStaff;
        onEnterSubmit(document.getElementById('invName'), ()=>is.click());
        onEnterSubmit(document.getElementById('invEmail'), ()=>is.click());
      }
      v.querySelectorAll('[data-cancel-invite]').forEach(el=>el.onclick=()=>cancelInvite(el.dataset.cancelInvite));
      v.querySelectorAll('[data-remove-user]').forEach(el=>el.onclick=()=>removeStaff(el.dataset.removeUser));
      v.querySelectorAll('[data-role-user]').forEach(el=>el.onchange=()=>changeStaffRole(el.dataset.roleUser, el.value));
    } else if(state.view==='venues'){
      v.innerHTML=viewLokationer();
      const vc=document.getElementById('venCreate'); if(vc){ vc.onclick=createVenue; onEnterSubmit(document.getElementById('venName'), ()=>vc.click()); }
      v.querySelectorAll('[data-venue-name]').forEach(el=>{
        const before=el.value;
        el.onblur=()=>{ if(el.value!==before) renameVenue(el.dataset.venueName, el.value); };
      });
      v.querySelectorAll('[data-room-name]').forEach(el=>{
        const before=el.value;
        el.onblur=()=>{ if(el.value!==before) renameRoom(el.dataset.roomName, el.value); };
      });
      v.querySelectorAll('[data-venue-address]').forEach(el=>{
        const before=el.value;
        el.onblur=()=>{ if(el.value!==before) updateVenueAddress(el.dataset.venueAddress, el.value); };
      });
      v.querySelectorAll('[data-room-capacity]').forEach(el=>{
        const before=el.value;
        el.onblur=()=>{ if(el.value!==before) updateRoomCapacity(el.dataset.roomCapacity, el.value); };
      });
      v.querySelectorAll('[data-delete-venue]').forEach(el=>el.onclick=()=>deleteVenue(el.dataset.deleteVenue));
      v.querySelectorAll('[data-delete-room]').forEach(el=>el.onclick=()=>deleteRoom(el.dataset.deleteRoom));
      v.querySelectorAll('[data-add-room]').forEach(el=>{
        const input=document.querySelector(`[data-new-room="${el.dataset.addRoom}"]`);
        el.onclick=()=>addRoom(el.dataset.addRoom, input.value);
        onEnterSubmit(input, ()=>el.click());
      });
    } else if(state.view==='katalog'){
      v.innerHTML=viewKatalog();
      const cc=document.getElementById('ciCreate'); if(cc){ cc.onclick=createCatalogItem;
        onEnterSubmit(document.getElementById('ciName'), ()=>cc.click());
        onEnterSubmit(document.getElementById('ciPrice'), ()=>cc.click());
      }
      v.querySelectorAll('[data-delete-catalog-item]').forEach(el=>el.onclick=()=>deleteCatalogItem(el.dataset.deleteCatalogItem));
      v.querySelectorAll('.item-room').forEach(el=>el.onchange=()=>{
        if(el.checked) addCatalogItemRoom(el.dataset.item, el.dataset.room);
        else removeCatalogItemRoom(el.dataset.item, el.dataset.room);
      });
      v.querySelectorAll('[data-toggle-venue-rooms]').forEach(el=>el.onclick=()=>{
        const [itemId,venueId]=el.dataset.toggleVenueRooms.split('|');
        const groupIds=(state.orgRooms||[]).filter(r=>r.venue_id===venueId).map(r=>r.id);
        const item=(state.orgCatalog||[]).find(c=>c.id===itemId);
        const allIn=groupIds.every(id=>(item.roomIds||[]).includes(id));
        if(allIn) removeCatalogItemRooms(itemId, groupIds);
        else addCatalogItemRooms(itemId, groupIds.filter(id=>!(item.roomIds||[]).includes(id)));
      });
      v.querySelectorAll('[data-ci-toggle-venue]').forEach(el=>el.onclick=()=>{
        const boxes=[...document.querySelectorAll(`.ci-room[data-venue="${el.dataset.ciToggleVenue}"]`)];
        const allChecked=boxes.length&&boxes.every(b=>b.checked);
        boxes.forEach(b=>b.checked=!allChecked);
      });
      v.querySelectorAll('[data-picker]').forEach(el=>el.ontoggle=()=>{
        if(el.open) state.openRoomPickers.add(el.dataset.picker);
        else state.openRoomPickers.delete(el.dataset.picker);
      });
    } else if(state.view==='opgaver'){
      v.innerHTML=viewOpgaver();
      const tc=document.getElementById('ttCreate'); if(tc){ tc.onclick=createTaskTemplate;

        onEnterSubmit(document.getElementById('ttDays'), ()=>tc.click());
        onEnterSubmit(document.getElementById('ttNote'), ()=>tc.click());
      }
      v.querySelectorAll('[data-delete-task-template]').forEach(el=>el.onclick=()=>deleteTaskTemplate(el.dataset.deleteTaskTemplate));
    } else {
      v.innerHTML=viewPicker();
      v.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openEvent(el.dataset.open));
      const nc=document.getElementById('neCreate'); if(nc){ nc.onclick=createEvent; onEnterSubmit(document.getElementById('neTitle'), ()=>nc.click()); }
      const sd=document.getElementById('setupDismiss'); if(sd) sd.onclick=async()=>{
        await sb.from('organisations').update({onboarding_dismissed:true}).eq('id',state.orgId);
        state.orgOnboardingDismissed=true; render();
      };
      v.querySelectorAll('[data-picker-group]').forEach(el=>el.ontoggle=()=>{
        if(el.open) state.openPickerGroups.add(el.dataset.pickerGroup);
        else state.openPickerGroups.delete(el.dataset.pickerGroup);
      });
    }
    v.querySelectorAll('[data-nav]').forEach(el=>el.onclick=async()=>{
      state.view=el.dataset.nav;
      if(state.view==='users') await loadUsers();
      if(state.view==='venues') await loadVenuesFull();
      if(state.view==='katalog') await loadOrgCatalog();
      if(state.view==='opgaver') await loadTaskTemplates();
      render();
    });
    return;
  }

  document.getElementById('heroTitle').textContent = state.eventTitle||'Arrangement';
  document.title = (state.eventTitle||'Arrangement')+' · Verta';
  document.getElementById('orgName').textContent = state.orgName||'';
  const locName = state.venueName||'';
  const rl = roomsLine();
  document.getElementById('eventLoc').innerHTML = locName
    ? '<span class="loc">'+esc(locName)+'</span>'+(rl?' · '+rl:'') : '';
  if(state.tab==='beskeder') state.lastRead[state.rolle]=Date.now();
  document.getElementById('whoami').textContent='Logget ind som '+currentActor().navn;
  heroChips(); renderTabs();
  const map={oversigt:viewOversigt,gaester:viewGaester,punkter:viewPunkter,koekken:viewKoekken,log:viewLog,admin:viewAdmin,tidslinje:viewTidslinje,beskeder:viewBeskeder};
  if(!map[state.tab]) state.tab='oversigt';
  document.getElementById('view').innerHTML=map[state.tab]();
  document.getElementById('legal').textContent = state.rolle==='kilden'
    ? 'Medarbejdervisning. Fuld log med opslag og ændringer.'
    : 'Brudeparrets visning via magic link. Tidslinjen viser kun ændringer — ikke hvem der har kigget hvornår.';
  bind();
}

function bind(){
  document.querySelectorAll('[data-set-status]').forEach(el=>el.onclick=()=>{
    const [id,status]=el.dataset.setStatus.split('|');
    setEventStatus(id, status);
  });
  const soeg=document.getElementById('soeg');
  if(soeg) soeg.oninput=e=>{state.soeg=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('soeg');n.focus();n.setSelectionRange(p,p);};

  const add=document.getElementById('tilfoej');
  if(add) add.onclick=()=>guestMutation(()=>state.gaester.push({id:'n'+Date.now(),navn:'Ny gæst',kat:'voksen',reception:true,middag:true,kost:''}),'Gæst tilføjet');

  const eks=document.getElementById('eksport');
  if(eks) eks.onclick=()=>{
    const blob=new Blob([JSON.stringify({eventTitle:state.eventTitle, eventDate:state.eventDate, offerTotal:state.offerTotal, gaester:state.gaester, punkter:state.punkter, log:state.log},null,2)],{type:'application/json'});
    const slug=(state.eventTitle||'arrangement').toLowerCase().replace(/[^a-z0-9æøå]+/gi,'-').replace(/^-+|-+$/g,'');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slug+'-'+(state.eventDate||'')+'.json';a.click();
  };

  const pr=document.getElementById('print'); if(pr) pr.onclick=()=>window.print();

  document.querySelectorAll('.tbl tbody tr').forEach(tr=>{
    const g=state.gaester.find(x=>x.id===tr.dataset.id);

const gFromDb = r => ({id:r.id, navn:r.name, kat:r.category, reception:r.reception, middag:r.dinner, kost:r.dietary||''});
const gToDb   = (g,i) => ({id:g.id, event_id:state.eventId, name:g.navn, category:g.kat, reception:g.reception, dinner:g.middag, dietary:g.kost, sort_order:i});
const pFromDb = r => ({id:r.id, titel:r.title, ejer:r.owner, status:r.status, frist:r.due_date||'', note:r.note||''});
const logFromDb = r => ({id:r.id, ts:new Date(r.ts).getTime(), side:r.actor_side, who:r.actor_name, type:r.entry_type, area:r.area, label:r.label, from:r.from_val, to:r.to_val, cust:r.customer_visible, friendly:r.friendly, text:r.message_text, ip:r.ip_address||''});
const logToDb   = e => ({event_id:state.eventId, ts:new Date(e.ts).toISOString(), actor_name:e.who, actor_side:e.side, entry_type:e.type, area:e.area, label:e.label||'', from_val:e.from||'', to_val:e.to||'', customer_visible:!!e.cust, friendly:e.friendly||'', message_text:e.text||''});

async function cloudSaveGuestsAgenda(){
  try{
    await sb.from('guests').upsert(state.gaester.map(gToDb));
    const goneG=[...state._dbG].filter(id=>!state.gaester.find(g=>g.id===id));
    if(goneG.length) await sb.from('guests').delete().in('id',goneG);
    state._dbG=new Set(state.gaester.map(g=>g.id));
  }catch(e){ console.error('cloud save', e); }
}

async function cloudBoot(user){
  state.userEmail=user.email; state.userId=user.id;
  const {data:sa}=await sb.from('superadmins').select('name').eq('id',user.id).maybeSingle();
  if(sa){
    state.isSuperadmin=true; state.isAdmin=true; state.rolle='kilden';
    state.actor={navn:(sa.name||'Superadmin')+' (Verta)', side:'kilden'};
    state.superadminActor=state.actor;
    state.view='superadmin';
    showApp();
    await loadSuperadminHome(); render();
    return;
  }
  const {data:st}=await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  if(st){
    state.rolle='kilden'; state.actor={navn:st.name, side:'kilden'}; state.isAdmin=(st.role==='admin'); state.orgId=st.org_id;
    const [{data:orgRow},{data:vens},{count:catCount},{count:staffCnt},{data:evs}] = await Promise.all([
      sb.from('organisations').select('name,onboarding_dismissed').eq('id',st.org_id).maybeSingle(),
      sb.from('venues').select('id,name').eq('org_id',st.org_id).order('name'),
      sb.from('catalog_items').select('id',{count:'exact',head:true}).eq('org_id',st.org_id),
      sb.from('staff').select('id',{count:'exact',head:true}).eq('org_id',st.org_id),
      sb.from('events').select('id,title,event_date,status,offer_total_kr,event_type,venues(name)').order('event_date',{ascending:false})
    ]);
    state.orgName=orgRow?orgRow.name:'';
    state.orgOnboardingDismissed=!!(orgRow&&orgRow.onboarding_dismissed);
    state.venues=vens||[];
    state.orgCatalogCount=catCount||0;
    state.orgStaffCount=staffCnt||0;
    state.events=evs||[];
    if(state.events.length===1) openEvent(state.events[0].id); else showPicker();
    return;
  }
  const {data:acc}=await sb.from('event_access').select('id,event_id,display_name,first_visited_at').eq('user_id',user.id);
  if(acc&&acc.length){
    state.rolle='kunde'; state.actor={navn:acc[0].display_name, side:'kunde'};
    state.guestWelcome=!acc[0].first_visited_at;
    if(!acc[0].first_visited_at) sb.from('event_access').update({first_visited_at:new Date().toISOString()}).eq('id',acc[0].id).then(()=>{});
    openEvent(acc[0].event_id); return;
  }
  showNoAccess();
}

async function openEvent(id){
  state.eventId=id;
  const [{data:ev},{data:gs},{data:ps},{data:lg}]=await Promise.all([
    sb.from('events').select('*,venues(name),organisations(name)').eq('id',id).maybeSingle(),
    sb.from('guests').select('*').eq('event_id',id).order('sort_order'),
    sb.from('agenda_items').select('*').eq('event_id',id).order('sort_order'),
    sb.from('activity_log').select('*').eq('event_id',id).order('ts',{ascending:false})
  ]);
  if(ev){ state.offerTotal=ev.offer_total_kr; state.eventDate=ev.event_date; state.eventTitle=ev.title; state.venueName=ev.venues?ev.venues.name:''; state.venueId=ev.venue_id; state.orgName=ev.organisations?ev.organisations.name:(state.orgName||''); state.ownerStaffId=ev.owner_staff_id; state.eventType=ev.event_type; state.status=ev.status; }
  state.gaester=(gs||[]).map(gFromDb);
  state.punkter=(ps||[]).map(pFromDb);
  state.log=(lg||[]).map(logFromDb);
  state._dbG=new Set(state.gaester.map(g=>g.id));

let realtimeChannel=null;
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
}
function subscribeRealtime(id){
  unsubscribeRealtime();
  realtimeChannel = sb.channel('event-'+id)
    .on('postgres_changes', {event:'*', schema:'public', table:'activity_log', filter:'event_id=eq.'+id}, async()=>{
      const {data:lg}=await sb.from('activity_log').select('*').eq('event_id',id).order('ts',{ascending:false});
      state.log=(lg||[]).map(logFromDb); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'guests', filter:'event_id=eq.'+id}, async()=>{
      const {data:gs}=await sb.from('guests').select('*').eq('event_id',id).order('sort_order');
      state.gaester=(gs||[]).map(gFromDb); state._dbG=new Set(state.gaester.map(g=>g.id)); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'agenda_items', filter:'event_id=eq.'+id}, async()=>{
      await reloadPunkter(); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'agenda_item_notes', filter:'event_id=eq.'+id}, async()=>{
      await loadAgendaNotes(id); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'event_rooms', filter:'event_id=eq.'+id}, async()=>{
      await loadRooms(id); render();
    })
    .subscribe();
}

  const title=document.getElementById('ttTitle').value.trim();
  const owner=document.getElementById('ttOwner').value;
  const daysRaw=document.getElementById('ttDays').value;
  const days=daysRaw===''?null:(parseInt(daysRaw,10)||0);
  const note=document.getElementById('ttNote').value.trim();
  const eventType=document.getElementById('ttEventType').value||null;
  if(!title){ showToast('Skriv en titel.','error'); return; }
  const btn=document.getElementById('ttCreate'), orig=btn.textContent;
  btn.disabled=true; btn.textContent='Opretter…';
  const {error}=await sb.from('task_templates').insert({org_id:state.orgId, title, owner, days_before_event:days, note, event_type:eventType});
  btn.disabled=false; btn.textContent=orig;
  if(error){ showToast('Kunne ikke oprette: '+error.message,'error'); return; }
  await loadTaskTemplates(); render();
}
async function deleteTaskTemplate(id){
  if(!(await appConfirm('Slet skabelonen? Kan ikke fortrydes.'))) return;
  const {error}=await sb.from('task_templates').delete().eq('id',id);
  if(error){ showToast('Kunne ikke slette: '+error.message,'error'); return; }
  await loadTaskTemplates(); render();
}
async function generateGuestLink(name, email){
  if(!name || !email){ showToast('Udfyld både navn og mail.','error'); return; }
  state.guestLinkBusy=true; render();
  try{
    const {data, error}=await sb.functions.invoke('invite-guest', {body:{eventId:state.eventId, email, displayName:name}});
    if(error || !data || !data.link){
      showToast('Kunne ikke oprette link: '+(error?.message || data?.error || 'ukendt fejl'),'error');
      return;
    }
    state.guestLink=data.link;
    pushLog({area:'system', label:'Gæstelink', cust:false, friendly:'Magisk link genereret til '+name+' ('+email+')'});
  }catch(e){
    showToast('Kunne ikke oprette link: '+e.message,'error');
  }finally{
    state.guestLinkBusy=false; render();
  }
}
function copyGuestLink(){
  if(!state.guestLink) return;
  navigator.clipboard.writeText(state.guestLink).then(()=>{
    const btn=document.getElementById('guestLinkCopy');
    if(btn){ const old=btn.textContent; btn.textContent='Kopieret!'; setTimeout(()=>btn.textContent=old,1500); }
  });
}
async function createEvent(){
  const title=document.getElementById('neTitle').value.trim();
  const venueId=document.getElementById('neVenue').value;
  const date=document.getElementById('neDate').value;
  const eventType=document.getElementById('neType').value;
  const useTasks=document.getElementById('neTasks').checked;
  if(!title||!venueId||!date){ showToast('Udfyld titel, lokation og dato.','error'); return; }
  const btn=document.getElementById('neCreate'), orig=btn.textContent;
  btn.disabled=true; btn.textContent='Opretter…';
  const {error}=await sb.from('events')
    .insert({title, venue_id:venueId, org_id:state.orgId, event_date:date, offer_total_kr:0, status:'kladde', event_type:eventType});
  btn.disabled=false; btn.textContent=orig;
  if(error){ showToast('Kunne ikke oprette: '+error.message,'error'); return; }
  const {data:evs}=await sb.from('events').select('id,title,event_date,status,offer_total_kr,event_type,venues(name)').eq('org_id',state.orgId).order('event_date',{ascending:false});
  state.events=evs||[];
  const created=(state.events||[]).find(e=>e.title===title && e.event_date===date);
  if(created){
    if(useTasks) await applyTaskTemplates(created.id, date, eventType);
    openEvent(created.id);
  } else render();
}

(async function init(){
  const gateSend=document.getElementById('gateSend');
  gateSend.onclick=async(ev)=>{
    const email=document.getElementById('gateEmail').value.trim(); if(!email) return;
    const btn=ev.currentTarget, orig=btn.textContent;
    btn.disabled=true; btn.textContent='Sender…';
    const {error}=await sb.auth.signInWithOtp({email, options:{emailRedirectTo:location.href.split('#')[0]}});
    document.getElementById('gateMsg').textContent = error ? ('Fejl: '+error.message) : ('Tjek din indbakke — vi har sendt et login-link til '+email+'.');
    btn.disabled=false; btn.textContent=orig;
  };
  onEnterSubmit(document.getElementById('gateEmail'), ()=>gateSend.click());

  let gateMode='link';
  const gatePwLogin=document.getElementById('gatePasswordLogin');
  const gateToggle=document.getElementById('gateToggleMode');
  function setGateMode(mode){
    gateMode=mode;
    const isPw = mode==='password';
    gateSend.style.display = isPw?'none':'';
    document.getElementById('gatePassword').style.display = isPw?'':'none';
    gatePwLogin.style.display = isPw?'':'none';
    gateToggle.textContent = isPw ? 'Log ind med magisk link i stedet' : 'Har du et kodeord? Log ind med det i stedet';
    document.getElementById('gateMsg').textContent = isPw ? 'Skriv din mail og dit kodeord.' : 'Skriv din mail — du får et link, du logger ind med. Ingen adgangskode.';
  }
  gateToggle.onclick=()=>setGateMode(gateMode==='password'?'link':'password');
  gatePwLogin.onclick=async()=>{
    const email=document.getElementById('gateEmail').value.trim();
    const password=document.getElementById('gatePassword').value;
    if(!email||!password) return;
    const orig=gatePwLogin.textContent;
    gatePwLogin.disabled=true; gatePwLogin.textContent='Logger ind…';
    const {error}=await sb.auth.signInWithPassword({email,password});
    gatePwLogin.disabled=false; gatePwLogin.textContent=orig;
    if(error) document.getElementById('gateMsg').textContent='Forkert mail eller kodeord.';
  };
  onEnterSubmit(document.getElementById('gatePassword'), ()=>gatePwLogin.click());

  document.getElementById('setPasswordBtn').onclick=()=>{
    document.getElementById('pwNew').value='';
    document.getElementById('pwConfirm').value='';
    document.getElementById('passwordModal').style.display='flex';
  };
  document.getElementById('pwCancel').onclick=()=>{ document.getElementById('passwordModal').style.display='none'; };
  const pwSave=document.getElementById('pwSave');
  pwSave.onclick=async()=>{
    const pw1=document.getElementById('pwNew').value;
    const pw2=document.getElementById('pwConfirm').value;
    if(pw1.length<8){ showToast('Kodeordet skal være mindst 8 tegn.','error'); return; }
    if(pw1!==pw2){ showToast('Kodeordene er ikke ens.','error'); return; }
    const orig=pwSave.textContent;
    pwSave.disabled=true; pwSave.textContent='Gemmer…';
    const {error}=await sb.auth.updateUser({password:pw1});
    pwSave.disabled=false; pwSave.textContent=orig;
    if(error){ showToast('Kunne ikke sætte kodeord: '+error.message,'error'); return; }
    document.getElementById('passwordModal').style.display='none';
    showToast('Kodeord sat. Du kan nu logge ind med det.','ok');
  };
  onEnterSubmit(document.getElementById('pwConfirm'), ()=>pwSave.click());

  document.getElementById('logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  document.getElementById('backToList').onclick=()=>{ showPicker(); };
  const {data:{session}}=await sb.auth.getSession();
  if(session) cloudBoot(session.user); else showGate();
  sb.auth.onAuthStateChange((_e,s)=>{ if(s&&!state.eventId&&state.view!=='picker'&&state.view!=='superadmin') cloudBoot(s.user); });
})();
</script>
</body>
</html>
