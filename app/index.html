.card > summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;cursor:pointer}

select.status{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:5px 8px;font-size:13px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}

.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .1s ease,filter .15s ease,border-color .15s ease}

.tl{position:relative;margin-top:6px;padding-left:22px}

.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}

.msg{border-left:3px solid var(--ink);border-radius:0 var(--radius) var(--radius) 0;background:#fff;padding:11px 14px;margin:10px 0}

.msg .mwho{font-weight:600;font-size:13.5px}

footer.legal{margin-top:28px;font-size:12px;color:var(--ink-40);line-height:1.6}

function pushLog({area,label,from='',to='',cust=false,friendly=''}){
  const a=currentActor();
  const ev={id:'e'+Date.now()+Math.random().toString(36).slice(2,5), ts:Date.now(),
    side:a.side, who:a.navn, type:'change', area, label, from:String(from), to:String(to), cust, friendly, text:''};
  state.log.unshift(ev);
  if(MODE==='cloud') sb.from('activity_log').insert(logToDb(ev)).then(({error})=>error&&console.error('log',error));
}
function logView(){
  const a=currentActor(), last=state.log[0];
  if(last && last.type==='view' && last.side===a.side && (Date.now()-last.ts)<30*60000) return;
  state.log.unshift({id:'v'+Date.now(), ts:Date.now(), side:a.side, who:a.navn,
    type:'view', area:'system', label:'Åbnede arrangementet', from:'', to:'', cust:false, friendly:''});
  save();
}
function pushMessage(text){
  const a=currentActor();
  const ev={id:'m'+Date.now(), ts:Date.now(), side:a.side, who:a.navn,
    type:'message', area:'system', text:text.trim(), from:'', to:'', cust:false, friendly:''};
  state.log.unshift(ev);
  state.lastRead[a.side]=Date.now();
  if(MODE==='cloud') sb.from('activity_log').insert(logToDb(ev)).then(({error})=>error&&console.error('msg',error));
  else save();
  /* v2: her udløser en Edge Function en mail til den anden part */
}

  const g=state.gaester, t=k=>({
    voksne:g.filter(x=>x[k]&&x.kat==='voksen').length,
    boern: g.filter(x=>x[k]&&x.kat==='barn').length,
    babyer:g.filter(x=>x[k]&&x.kat==='baby').length });
  const r=t('reception'), m=t('middag');
  r.total=r.voksne+r.boern+r.babyer; m.total=m.voksne+m.boern+m.babyer;

      <select id="fWho"><option value="alle">Alle personer</option>${whoList.map(w=>`<option value="${esc(w)}" ${state.logWho===w?'selected':''}>${esc(w)}</option>`).join('')}</select>
      <select id="fArea"><option value="alle">Alle områder</option>${Object.entries(AREA_TXT).map(([k,v])=>`<option value="${k}" ${state.logArea===k?'selected':''}>${v}</option>`).join('')}</select>
    </div>
    ${rows.length?rows.map(e=>`<div class="logrow ${e.type==='view'?'viewrow':''}">
      <span class="when">${tid(e.ts)}</span>
      <span class="who"><span class="dot ${e.side}"></span>${esc(e.who.split(' (')[0])}</span>
      <span class="what">${
        e.type==='view' ? '<span class="view">kiggede ind</span>' :
        e.type==='message' ? `<span class="tag">Besked</span><span class="msgq">”${esc(e.text||'')}”</span>` :
        `<span class="tag">${AREA_TXT[e.area]}</span>${esc(e.label)}${(e.from||e.to)?` <span class="delta">${e.from?esc(e.from):'—'}<span class="arrow">→</span>${esc(e.to)}</span>`:''}`}</span>
    </div>`).join(''):'<div class="empty">Ingen hændelser matcher filteret.</div>'}
  </section>`;
}

function viewTidslinje(){
  const evs=state.log.filter(e=>e.type==='change'&&e.cust).sort((a,b)=>b.ts-a.ts);
  const grupper={};
  evs.forEach(e=>{const d=new Date(e.ts).toLocaleDateString('da-DK',{day:'numeric',month:'long',year:'numeric'});(grupper[d]=grupper[d]||[]).push(e);});
  return `
  <section class="card">
    <header><h2>Ændringer i jeres aftale</h2><span class="note">nyeste øverst</span></header>
    ${evs.length?`<div class="tl">${Object.entries(grupper).map(([dag,liste])=>`
      <div class="tlday">${dag}</div>
      ${liste.map(e=>`<div class="tlitem ${e.side}">
        <div class="txt">${esc(e.friendly)}</div>
        <div class="by">${e.side==='kunde'?'af jer':'af Kilden'} · ${new Date(e.ts).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>`).join('')}`).join('')}</div>`
    :'<div class="empty">Ingen ændringer endnu.</div>'}
  </section>`;
}

function viewBeskeder(){
  const msgs=state.log.filter(e=>e.type==='message').sort((a,b)=>b.ts-a.ts);
  const modpart = state.rolle==='kilden' ? 'brudeparret' : 'Kilden';
  return `
  <section class="card">
    <header><h2>Beskeder</h2><span class="note">${msgs.length} i tråden</span></header>
    <div class="compose">
      <textarea id="msgtext" placeholder="Skriv en besked til ${modpart}…"></textarea>
      <div class="crow">
        <span class="hint">Sendes som mail til ${modpart}. Ikke en live-chat — svar kommer i åbningstiden.</span>
        <button class="btn primary" id="sendmsg">Send besked</button>
      </div>
    </div>
    ${msgs.length?msgs.map(m=>`<div class="msg ${m.side}">
      <div class="mhead"><span class="mwho">${esc(m.who)}</span><span class="mtime">${tid(m.ts)}</span></div>
      <div class="mtext">${esc(m.text||'')}</div>
    </div>`).join(''):'<div class="empty">Ingen beskeder endnu. Skriv den første ovenfor.</div>'}
  </section>`;
}

    setEventStatus(id, status);
  });

  const add=document.getElementById('tilfoej');
  if(add) add.onclick=()=>guestMutation(()=>state.gaester.push({id:'n'+Date.now(),navn:'Ny gæst',kat:'voksen',reception:true,middag:true,kost:''}),'Gæst tilføjet');

  const eks=document.getElementById('eksport');
  if(eks) eks.onclick=()=>{const blob=new Blob([JSON.stringify({event:EVENT,gaester:state.gaester,punkter:state.punkter,log:state.log},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bryllup-2026-09-04.json';a.click();};

  const pr=document.getElementById('print'); if(pr) pr.onclick=()=>window.print();

  document.querySelectorAll('.tbl tbody tr').forEach(tr=>{
    const g=state.gaester.find(x=>x.id===tr.dataset.id);

      const f=el.dataset.f;
      if(el.type==='checkbox') el.onchange=()=>guestMutation(()=>g[f]=el.checked, (f==='middag'?'Middag':'Reception')+(el.checked?' tilføjet':' fjernet')+' · '+g.navn);
      else if(el.tagName==='SELECT') el.onchange=()=>guestMutation(()=>g[f]=el.value, 'Kategori ændret · '+g.navn);
      else { const before=g[f]; el.oninput=()=>g[f]=el.value;
        el.onblur=()=>{ if(g[f]!==before){
          if(f==='kost') pushLog({area:'gaester',label:'Særlig kost · '+g.navn,from:before||'—',to:g[f]||'—',cust:true,friendly:'Særlig kost opdateret for '+(g.navn||'en gæst')+(g[f]?' ('+g[f]+')':'')});
          else pushLog({area:'gaester',label:'Navn ændret',from:before||'—',to:g[f]||'—'});
          save(); render();
        }};
      }
    });
    const del=tr.querySelector('[data-slet]');
    if(del) del.onclick=()=>guestMutation(()=>state.gaester=state.gaester.filter(x=>x.id!==g.id),'Gæst fjernet · '+g.navn);
  });

  document.querySelectorAll('[data-pid]').forEach(el=>{
    const p=state.punkter.find(x=>x.id===el.dataset.pid);
    const sel=el.querySelector('[data-status]');
    if(sel) sel.onchange=()=>{const from=p.status;p.status=sel.value;
      pushLog({area:'punkter',label:p.titel,from,to:p.status,cust:true,friendly:p.titel+' er nu '+p.status});
      save();render();};
  });

  const fT=document.getElementById('fType'); if(fT) fT.onchange=()=>{state.logType=fT.value;render();};
  const fW=document.getElementById('fWho');  if(fW) fW.onchange=()=>{state.logWho=fW.value;render();};
  const fA=document.getElementById('fArea'); if(fA) fA.onchange=()=>{state.logArea=fA.value;render();};

  const sm=document.getElementById('sendmsg');
  if(sm) sm.onclick=()=>{const ta=document.getElementById('msgtext');const t=ta.value.trim();if(!t)return;pushMessage(t);render();};

  const ca=document.getElementById('coordAdd');
  if(ca) ca.onclick=()=>{const sel=document.getElementById('coordSel');if(sel.value)addCoordinator(sel.value);};
  document.querySelectorAll('[data-remove-coord]').forEach(b=>{ b.onclick=()=>removeCoordinator(b.dataset.removeCoord); });

  const cta=document.getElementById('catalogAdd');
  if(cta) cta.onclick=()=>{const sel=document.getElementById('catalogSel');if(sel.value)addCatalogToEvent(sel.value);};
  document.querySelectorAll('[data-remove-catalog]').forEach(b=>{ b.onclick=()=>removeCatalogFromEvent(b.dataset.removeCatalog); });

  PHASES.forEach(([ph])=>{
    const btn=document.querySelector(`[data-phase-save="${ph}"]`);
    if(!btn) return;
    const roomEl=document.querySelector(`[data-phase-field="room"][data-phase="${ph}"]`);
    const startEl=document.querySelector(`[data-phase-field="start"][data-phase="${ph}"]`);
    const endEl=document.querySelector(`[data-phase-field="end"][data-phase="${ph}"]`);
    btn.onclick=async()=>{
      btn.disabled=true; btn.textContent='Gemmer…';
      await setPhaseRoom(ph, roomEl.value, startEl.value, endEl.value);
    };
  });
}

async function cloudBoot(user){
  state.userEmail=user.email; state.userId=user.id;
  const {data:sa}=await sb.from('superadmins').select('name').eq('id',user.id).maybeSingle();
  if(sa){
    state.isSuperadmin=true; state.isAdmin=true; state.rolle='kilden';
    state.actor={navn:(sa.name||'Superadmin')+' (Verta)', side:'kilden'};
    state.view='superadmin';
    showApp();
    await loadSuperadminHome(); render();
    return;
  }
  const {data:st}=await sb.from('staff').select('*').eq('id',user.id).maybeSingle();
  if(st){
    state.rolle='kilden'; state.actor={navn:st.name, side:'kilden'}; state.isAdmin=(st.role==='admin'); state.orgId=st.org_id;
    const {data:orgRow}=await sb.from('organisations').select('name').eq('id',st.org_id).maybeSingle();
    state.orgName=orgRow?orgRow.name:'';
    const {data:vens}=await sb.from('venues').select('id,name').eq('org_id',st.org_id).order('name');
    state.venues=vens||[];
    const {data:evs}=await sb.from('events').select('id,title,event_date,status,offer_total_kr,event_type,venues(name)').order('event_date',{ascending:false});
    state.events=evs||[];
    if(state.events.length===1) openEvent(state.events[0].id); else showPicker();
    return;
  }
  const {data:acc}=await sb.from('event_access').select('event_id,display_name').eq('user_id',user.id);
  if(acc&&acc.length){ state.rolle='kunde'; state.actor={navn:acc[0].display_name, side:'kunde'}; openEvent(acc[0].event_id); return; }
  showNoAccess();
}

async function openEvent(id){
  state.eventId=id;
  const [{data:ev},{data:gs},{data:ps},{data:lg}]=await Promise.all([
    sb.from('events').select('*,venues(name),organisations(name)').eq('id',id).maybeSingle(),
    sb.from('guests').select('*').eq('event_id',id).order('sort_order'),
    sb.from('agenda_items').select('*').eq('event_id',id).order('sort_order'),
    sb.from('activity_log').select('*').eq('event_id',id).order('ts',{ascending:false})
  ]);
  if(ev){ EVENT.tilbud=ev.offer_total_kr; EVENT.dato=ev.event_date; state.eventTitle=ev.title; state.venueName=ev.venues?ev.venues.name:''; state.venueId=ev.venue_id; state.orgName=ev.organisations?ev.organisations.name:(state.orgName||''); state.ownerStaffId=ev.owner_staff_id; state.eventType=ev.event_type; state.status=ev.status; }
  state.gaester=(gs||[]).map(gFromDb);
  state.punkter=(ps||[]).map(pFromDb);
  state.log=(lg||[]).map(logFromDb);
  state._dbG=new Set(state.gaester.map(g=>g.id));
  state._dbP=new Set(state.punkter.map(p=>p.id));
  await loadRooms(id);
  await loadCatalog(id);
  if(state.rolle==='kilden'){ await loadEventStaff(); await loadOrgCatalog(); logCloudView(); }
  state.view='workspace'; state.tab='oversigt';
  showApp(); render();
  subscribeRealtime(id);
}

let realtimeChannel=null;
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
}
function subscribeRealtime(id){
  unsubscribeRealtime();
  realtimeChannel = sb.channel('event-'+id)
    .on('postgres_changes', {event:'*', schema:'public', table:'activity_log', filter:'event_id=eq.'+id}, async()=>{
      const {data:lg}=await sb.from('activity_log').select('*').eq('event_id',id).order('ts',{ascending:false});
      state.log=(lg||[]).map(logFromDb); render();
    })
    .subscribe();
}

function statusStepsHtml(status, eventId, interactive){
  const idx = EVENT_STATUSES.findIndex(([v])=>v===status);
  return `<div class="statussteps">${EVENT_STATUSES.map(([v,label],i)=>
    `<span class="sstep ${interactive?'interactive':''} ${i<idx?'done':i===idx?'current':''}"
      ${interactive?`data-set-status="${eventId}|${v}"`:''}>${label}</span>`).join('')}</div>`;
}

function groupRoomsByVenue(rooms){
  const order=[], map={};
  (rooms||[]).forEach(r=>{
    if(!map[r.venue_id]){ map[r.venue_id]={venueId:r.venue_id, venueName:r.venueName||'', rooms:[]}; order.push(r.venue_id); }
    map[r.venue_id].rooms.push(r);
  });
  return order.map(id=>map[id]);
}

async function createCatalogItem(){
  const name=document.getElementById('ciName').value.trim();
  const category=document.getElementById('ciCategory').value;
  const price=parseInt(document.getElementById('ciPrice').value||'0',10)||0;
  const basis=document.getElementById('ciBasis').value;
  const childHalf=document.getElementById('ciChildHalf').checked;
  const eventType=document.getElementById('ciEventType').value||null;
  const roomIds=[...document.querySelectorAll('.ci-room:checked')].map(el=>el.value);
  if(!name){ alert('Skriv et navn.'); return; }
  const btn=document.getElementById('ciCreate'), orig=btn.textContent;
  btn.disabled=true; btn.textContent='Opretter…';
  const {error}=await sb.from('catalog_items').insert({org_id:state.orgId, name, category, price_kr:price, basis, child_half:childHalf, event_type:eventType});
  if(error){ btn.disabled=false; btn.textContent=orig; alert('Kunne ikke oprette katalogvare: '+error.message); return; }
  if(roomIds.length){
    const {data:created}=await sb.from('catalog_items').select('id').eq('org_id',state.orgId).eq('name',name)
      .order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(created) await sb.from('catalog_item_rooms').insert(roomIds.map(rid=>({catalog_item_id:created.id, room_id:rid})));
  }
  btn.disabled=false; btn.textContent=orig;
  await loadOrgCatalog(); render();
}

async function loadRooms(id){
  const {data:er}=await sb.from('event_rooms').select('phase, room_id, start_time, end_time, rooms(name)').eq('event_id',id);
  state.phaseRooms={}; (er||[]).forEach(r=>{ state.phaseRooms[r.phase]={id:r.room_id, name:r.rooms?r.rooms.name:'', start:(r.start_time||'').slice(0,5), end:(r.end_time||'').slice(0,5)}; });
  if(state.rolle==='kilden' && state.venueId){
    const {data:vr}=await sb.from('rooms').select('id,name').eq('venue_id',state.venueId).order('sort_order');
    state.venueRooms=vr||[];
  }
}
async function setPhaseRoom(phase, roomId, startTime, endTime){
  if(roomId){
    const {error}=await sb.from('event_rooms').upsert({event_id:state.eventId, phase, room_id:roomId, start_time:startTime||null, end_time:endTime||null});
    if(error){ alert('Kunne ikke gemme lokale: '+error.message); await loadRooms(state.eventId); render(); return; }
  } else {
    await sb.from('event_rooms').delete().eq('event_id',state.eventId).eq('phase',phase);
  }
  const nm=(state.venueRooms.find(r=>r.id===roomId)||{}).name||'—';
  pushLog({area:'system', label:'Lokale · '+phase, from:'', to:nm, cust:false});
  await loadRooms(state.eventId); render();
}

async function createEvent(){
  const title=document.getElementById('neTitle').value.trim();
  const venueId=document.getElementById('neVenue').value;
  const date=document.getElementById('neDate').value;
  const price=parseInt(document.getElementById('nePrice').value||'0',10)||0;
  const status=document.getElementById('neStatus').value;
  const eventType=document.getElementById('neType').value;
  if(!title||!venueId||!date){ alert('Udfyld titel, lokation og dato.'); return; }
  const btn=document.getElementById('neCreate'), orig=btn.textContent;
  btn.disabled=true; btn.textContent='Opretter…';
  const {error}=await sb.from('events')
    .insert({title, venue_id:venueId, org_id:state.orgId, event_date:date, offer_total_kr:price, status, event_type:eventType});
  btn.disabled=false; btn.textContent=orig;
  if(error){ alert('Kunne ikke oprette: '+error.message); return; }
  const {data:evs}=await sb.from('events').select('id,title,event_date,status,offer_total_kr,event_type,venues(name)').order('event_date',{ascending:false});
  state.events=evs||[];
  const created=(state.events||[]).find(e=>e.title===title && e.event_date===date);
  if(created) openEvent(created.id); else render();
}

/* skærmstyring */
function showGate(msg){ const g=document.getElementById('gate'); g.style.display='flex'; document.querySelector('.wrap').style.visibility='hidden'; if(msg) document.getElementById('gateMsg').textContent=msg; }
function showApp(){ document.getElementById('gate').style.display='none'; document.querySelector('.wrap').style.visibility='visible'; }
function showNoAccess(){ showGate('Du er logget ind som '+state.userEmail+', men har endnu ikke adgang til et arrangement. Bed admin om at koble dig på.'); }
function showPicker(){ unsubscribeRealtime(); state.eventId=null; state.view='picker'; showApp(); render(); }
function goHome(){
  if(MODE!=='cloud'){ state.tab='oversigt'; render(); return; }
  if(!state.actor) return;
  if(state.isSuperadmin && !state.orgId){
    unsubscribeRealtime(); state.view='superadmin'; showApp();
    loadSuperadminHome().then(render); return;
  }
  if(state.rolle==='kilden') showPicker();
  else { state.view='workspace'; state.tab='oversigt'; render(); }
}

      </select>
      <label class="row" style="gap:4px;font-size:13px"><input type="checkbox" id="ciChildHalf">Børn halv pris</label>
    </div>
    <details style="margin-top:10px">
      <summary class="note" style="cursor:pointer">Lokaler (ingen valgt = alle lokaler) · vælg</summary>
      <div style="margin-top:8px">
        ${groupRoomsByVenue(state.orgRooms).map(g=>`<div style="margin-bottom:10px">
          <div class="row" style="justify-content:space-between;align-items:center;max-width:380px">
            <span class="note" style="font-weight:600">${esc(g.venueName)}</span>
            <button type="button" class="btn" data-ci-toggle-venue="${g.venueId}" style="font-size:11px;padding:3px 8px">Vælg alle</button>
          </div>
          <div class="row" style="gap:10px;flex-wrap:wrap;margin-top:4px">
            ${g.rooms.map(r=>`<label class="row" style="gap:4px;font-size:13px"><input type="checkbox" class="ci-room" data-venue="${g.venueId}" value="${r.id}">${esc(r.name)}</label>`).join('')}
          </div>
        </div>`).join('')}
      </div>
    </details>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="ciCreate">Opret katalogvare</button>
    </div>
  </section>`;
}
function viewLokationer(){
  return `${consoleNav('venues')}
  <div style="margin:20px 0 10px"><span class="eyebrow">Lokationer i ${esc(state.orgName||'organisationen')}</span></div>
  ${(state.venuesFull||[]).map(v=>`
  <section class="card">
    <header>
      <input class="search" data-venue-name="${v.id}" value="${esc(v.name)}" style="font-weight:700;border:0;background:transparent;padding:0;font-size:15px;flex:1">
      <span class="note">${v.rooms.length} lokale${v.rooms.length===1?'':'r'}</span>
    </header>
    <input class="search" data-venue-address="${v.id}" value="${esc(v.address||'')}" placeholder="Adresse…" style="width:100%;margin-bottom:10px;font-size:13px">
    ${v.rooms.length?v.rooms.map(r=>`<div class="stat" style="flex-wrap:wrap;gap:6px;align-items:center">
      <input class="search" data-room-name="${r.id}" value="${esc(r.name)}" style="flex:1;min-width:140px">
      <input type="number" min="0" class="search" data-room-capacity="${r.id}" value="${r.capacity_max??''}" placeholder="Max antal gæster" style="flex:1;min-width:160px;font-size:13px">
      <button class="btn" data-delete-room="${r.id}">Slet</button>
    </div>`).join(''):'<div class="empty">Ingen lokaler endnu.</div>'}
    <div class="row" style="margin-top:12px;gap:8px">
      <input class="search" placeholder="Nyt lokale…" data-new-room="${v.id}" style="flex:1">
      <button class="btn" data-add-room="${v.id}">Tilføj lokale</button>
      <button class="btn" data-delete-venue="${v.id}" style="margin-left:auto">Slet lokation</button>
    </div>
  </section>`).join('')}
  ${(state.venuesFull||[]).length?'':'<div class="empty">Ingen lokationer endnu.</div>'}
  <section class="card">
    <header><h2>Ny lokation</h2></header>
    <div class="row" style="gap:8px">
      <input id="venName" class="search" placeholder="Navn, fx Kilden" style="flex:1">
      <button class="btn primary" id="venCreate">Opret lokation</button>
    </div>
  </section>`;
}
function viewPicker(){
  const grp={}; EVENT_STATUSES.forEach(([v])=>grp[v]=[]);
  state.events.forEach(e=>{ (grp[e.status]||(grp[e.status]=[])).push(e); });
  const sec=(key,titel,liste)=>liste.length?`<details class="card" data-picker-group="${key}" ${state.openPickerGroups.has(key)?'open':''}>
    <summary><h2>${titel}</h2><span class="note">${liste.length}</span></summary>
    ${liste.map(e=>`<div class="item" data-open="${e.id}" style="cursor:pointer">
      <span class="stripe ${e.status!=='afviklet'?'jer':''}"></span>
      <div><div class="name">${esc(e.title)}</div><div class="meta">${e.event_type?e.event_type+' · ':''}${e.venues?esc(e.venues.name):''} · ${datoKort(e.event_date)}</div>${statusStepsHtml(e.status,e.id,false)}</div>
      <span class="chip"><span class="dot"></span>${e.offer_total_kr?kr(e.offer_total_kr):'—'}</span></div>`).join('')}</details>`:'';
  const nyKort = `
  <section class="card">
    <header><h2>Nyt arrangement</h2></header>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:4px">
      <input id="neTitle" class="search" placeholder="Titel, fx Emily &amp; Lars" style="flex:2;min-width:180px">
      <select id="neVenue" class="search" style="flex:1;min-width:140px">
        <option value="">Lokation…</option>
        ${(state.venues||[]).map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}
      </select>
      <input id="neDate" type="date" class="search" style="flex:1;min-width:140px">
      <input id="nePrice" type="number" class="search" placeholder="Tilbud, kr" style="flex:1;min-width:120px">
      <select id="neType" class="search" style="flex:1;min-width:130px">
        ${CAT_EVENT_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
      </select>
      <select id="neStatus" class="search" style="flex:1;min-width:120px">
        ${EVENT_STATUSES.map(([v,l])=>`<option value="${v}" ${v==='kladde'?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="btn primary" id="neCreate">Opret arrangement</button>
    </div>
  </section>`;
  return `${consoleNav('picker')}
    <div style="margin:20px 0 10px"><span class="eyebrow">${state.isAdmin?'Admin · alle arrangementer':'Dine arrangementer'}</span></div>
    ${nyKort}
    ${EVENT_STATUSES.map(([v,l])=>sec(v,l,grp[v])).join('')}
    ${state.events.length?'':'<div class="empty">Ingen arrangementer endnu.</div>'}`;
}
function viewBrugere(){
  return `${consoleNav('users')}
  <div style="margin:20px 0 10px"><span class="eyebrow">Medarbejdere i ${esc(state.orgName||'organisationen')}</span></div>
  <section class="card">
    <header><h2>Medarbejdere</h2><span class="note">${(state.staffList||[]).length}</span></header>
    ${(state.staffList||[]).map(s=>`<div class="stat">
      <span>${esc(s.name)}${s.id===state.userId?' <span class="note">(dig)</span>':''}</span>
      <span class="row" style="gap:8px">
        <select class="status" data-role-user="${s.id}" ${s.id===state.userId?'disabled':''}>
          <option value="coordinator" ${s.role==='coordinator'?'selected':''}>coordinator</option>
          <option value="admin" ${s.role==='admin'?'selected':''}>admin</option>
        </select>
        ${s.id===state.userId?'':`<button class="btn" data-remove-user="${s.id}">Fjern</button>`}
      </span>
    </div>`).join('')}
  </section>
  <section class="card">
    <header><h2>Ventende invitationer</h2><span class="note">${(state.invitesList||[]).length}</span></header>
    ${(state.invitesList||[]).length?(state.invitesList||[]).map(i=>`<div class="stat">
      <span>${esc(i.name)} <span class="note">${esc(i.email)} · ${i.role}</span></span>
      <button class="btn" data-cancel-invite="${i.id}">Fortryd</button>
    </div>`).join(''):'<div class="empty">Ingen ventende invitationer.</div>'}
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <input id="invName" class="search" placeholder="Navn" style="flex:1;min-width:140px">
      <input id="invEmail" class="search" type="email" placeholder="Mail" style="flex:1;min-width:180px">
      <select id="invRole" class="search" style="flex:1;min-width:120px">
        <option value="coordinator">coordinator</option>
        <option value="admin">admin</option>
      </select>
      <button class="btn primary" id="invSend">Invitér</button>
    </div>
    <div class="note" style="margin-top:10px">Der sendes ikke automatisk en mail endnu — giv personen selv besked om at logge ind med denne mail-adresse. Personen bliver automatisk medarbejder med den valgte rolle, første gang de logger ind.</div>
  </section>`;
}

(async function init(){
  if(MODE==='local'){
    const saved=await store.load();
    if(saved&&saved.gaester){ state.gaester=saved.gaester; state.punkter=saved.punkter||state.punkter; state.log=saved.log||state.log; state.lastRead=saved.lastRead||state.lastRead; }
    logView(); render();
    return;
  }
  // CLOUD
  document.getElementById('gateSend').onclick=async(ev)=>{
    const email=document.getElementById('gateEmail').value.trim(); if(!email) return;
    const btn=ev.currentTarget, orig=btn.textContent;
    btn.disabled=true; btn.textContent='Sender…';
    const {error}=await sb.auth.signInWithOtp({email, options:{emailRedirectTo:location.href.split('#')[0]}});
    document.getElementById('gateMsg').textContent = error ? ('Fejl: '+error.message) : ('Tjek din indbakke — vi har sendt et login-link til '+email+'.');
    btn.disabled=false; btn.textContent=orig;
  };
  document.getElementById('logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  document.getElementById('backToList').onclick=()=>{ showPicker(); };
  const {data:{session}}=await sb.auth.getSession();
  if(session) cloudBoot(session.user); else showGate();
  sb.auth.onAuthStateChange((_e,s)=>{ if(s&&!state.eventId&&state.view!=='picker'&&state.view!=='superadmin') cloudBoot(s.user); });
})();
</script>
